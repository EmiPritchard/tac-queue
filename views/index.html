  const names = Object.keys(counts).sort((a, b) =>
    a === 'Unassigned' ? 1 : b === 'Unassigned' ? -1 : a.localeCompare(b));
  // Someone who has cleared their queue since the last refresh would leave a
  // dangling selection — fall back to everyone rather than showing an empty page.
  if (priorityAssignee && !counts[priorityAssignee]) priorityAssignee = '';

  const options = [`<option value="">All assignees (${issues.length})</option>`]
    .concat(names.map(n =>
      `<option value="${esc(n)}"${n === priorityAssignee ? ' selected' : ''}>${esc(n)} (${counts[n]})</option>`))
    .join('');

  // Independent of assignee/personal-mode filtering, so both appear in both
  // branches below.
  const awaitingInternalToggle = `<label class="pc-checkbox">
       <input type="checkbox" ${showAwaitingInternal ? 'checked' : ''} onchange="onShowAwaitingInternalChange(this.checked)">
       <span>Show Awaiting Internal Team</span>
     </label>`;
  const tacTierSelect = `<div class="tt-multiselect">
       <button type="button" class="tt-ms-btn${tacTierPanelOpen ? ' is-open' : ''}" onclick="toggleTacTierPanel(event)">
         <span>${esc(tacTierButtonLabel())}</span>${ico('chevron-down', 10)}
       </button>
       ${tacTierPanelOpen ? `<div class="tt-ms-panel" onclick="event.stopPropagation()">
         ${TAC_TIER_OPTIONS.map(t => `<label class="tt-ms-option">
           <input type="checkbox" ${selectedTacTiers.has(t) ? 'checked' : ''} onchange="onTacTierCheck('${t}', this.checked)">
           <span>${esc(t)}</span>
         </label>`).join('')}
       </div>` : ''}
     </div>`;

  // In personal mode the picker is redundant — the whole page is already scoped
  // to the viewer — so it is replaced by a static chip rather than left live and
  // able to contradict the header toggle.
  const controls = (personalMode && personalUser)
    ? `<span class="pm-chip">${ico('user',11)}Your tickets only</span>
       ${tacTierSelect}
       ${awaitingInternalToggle}
       <span class="priority-summary" id="priority-summary"></span>`
    : `<label class="pc-label" for="priority-assignee">Assignee</label>
       <div class="pc-select-wrap">
         <select class="pc-select" id="priority-assignee" onchange="onPriorityAssigneeChange(this.value)">${options}</select>
         ${ico('chevron-down', 10)}
       </div>
       ${tacTierSelect}
       ${awaitingInternalToggle}
       <span class="priority-summary" id="priority-summary"></span>`;
  el.innerHTML = `
    ${personalBanner()}
    <div class="priority-controls">${controls}</div>
    <div id="priority-table"></div>`;
  renderPriorityTable(issues);
}

// Repaints only the table, so changing the select never destroys the element
// that is mid-event. Tiering re-runs on the filtered set, so the ranking you
// see for one person is their own queue order, numbered from 1.
function renderPriorityTable(issues) {
  const table = document.getElementById('priority-table');
  const summary = document.getElementById('priority-summary');
  if (!table) return;
  let shown = priorityAssignee ? issues.filter(i => assigneeName(i) === priorityAssignee) : issues;
  shown = shown.filter(matchesTacTier);
  const isAwaitingInternal = i => i.fields?.status?.name === 'Awaiting Internal Team';
  const hiddenCount = showAwaitingInternal ? 0 : shown.filter(isAwaitingInternal).length;
  if (!showAwaitingInternal) shown = shown.filter(i => !isAwaitingInternal(i));
  if (summary) {
    const hiddenNote = hiddenCount
      ? ` ${hiddenCount} Awaiting Internal Team hidden.`
      : '';
    summary.textContent = (priorityAssignee
      ? `${shown.length} ticket${shown.length !== 1 ? 's' : ''} for ${priorityAssignee}, ordered by triage priority.`
      : `${shown.length} open ticket${shown.length !== 1 ? 's' : ''}, ordered by triage priority.`) + hiddenNote;
  }
  if (!shown.length) {
    // Give the specific reason where there is one — an unqualified "No open
    // tickets for [blank]." (the old message, with no assignee selected) reads
    // as broken rather than filtered.
    const msg = hiddenCount
      ? `${hiddenCount} Awaiting Internal Team ticket${hiddenCount !== 1 ? 's' : ''} hidden. Tick "Show Awaiting Internal Team" above to see ${hiddenCount !== 1 ? 'them' : 'it'}.`
      : selectedTacTiers.size === 0
        ? 'No TAC Tier selected. Check at least one tier above to see tickets.'
        : priorityAssignee
          ? `No open tickets for ${esc(priorityAssignee)}.`
          : 'No open tickets match the current filters.';
    table.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  const groups = buildPriorityList(shown);
  let rank = 0;
  const bodyRows = groups.map(g => {
    if (!g.items.length) return '';
    const rows = g.items.map(i => priorityRow(i, ++rank)).join('');
    return `<tr class="tier-row"><td colspan="${PRIORITY_COLS}">${esc(g.label)}<span class="drill-count">${g.items.length}</span></td></tr>${rows}`;
  }).join('');
  table.innerHTML = `<div class="scroll-x"><table class="tbl">${PRIORITY_THEAD}<tbody>${bodyRows}</tbody></table></div>`;
}

function onPriorityAssigneeChange(value) {
  priorityAssignee = value;
  renderPriorityTable(ALL_ISSUES);
}

// ═══════════════════════════════════════════════════════════════════════════
// ── Closed list ───────────────────────────────────────────────────────────────
// Every closed/resolved ticket in a chosen window, newest close first.
//
// This is the one view that does NOT derive from the single live-queue fetch:
// that pull is scoped to `resolution = Unresolved`, so closed tickets are
// simply not in RAW_ISSUES. It runs its own query per date range, which is
// also why it carries the only cache and the only pager in the dashboard.
//
// "Closed" is statusCategory = Done, NOT "has a resolution date". Seven TAC
// tickets carry a resolution date but were later reopened into a live status
// (TAC-6188, resolved 3 Sep, now Pending Response; also TAC-6214, TAC-6152,
// TAC-6031, TAC-5990, TAC-5440, TAC-5400). Keying off `resolved IS NOT EMPTY`
// would list those as closed while they are actively being worked. Note the
// side effect: those seven are missing from the Live queue too, because its
// JQL says `resolution = Unresolved` — so today they appear in NO view. That
// is a pre-existing live-queue gap (see CLAUDE.md), not one this list added.
// ═══════════════════════════════════════════════════════════════════════════

// Jira's own `name` on each SLA object, confirmed against live payloads on
// 4 Sep 2026 — used for the SLA picker and the breach tooltip. Never written
// into JQL: the literal "Resolution" collides with Jira's built-in resolution
// field there and silently matches nothing (CLAUDE.md section 3).
const SLA_FIELD_NAMES = {
  customfield_10967: 'First Response Time',
  customfield_10968: 'Restoration',
  customfield_10969: 'Resolution',
  customfield_10970: 'Time with Agent',
  customfield_10879: 'Triage target',
  customfield_10906: 'Response Target',
};

// resolutiondate drives both the sort and the range filter. No 'created' or
// 'updated': neither is displayed, and every extra field shrinks Jira's page
// size, which costs pager round-trips directly on the big ranges.
const CLOSED_FIELDS = ['summary','status','priority','assignee','resolutiondate','issuelinks',TAC_TIER_FIELD,...SLA_ALL];

// ── Date ranges ───────────────────────────────────────────────────────────────
// Every bound uses Jira's OWN date functions rather than a literal like
// "2026-07-01". Two reasons: a literal is interpreted in the viewer's Jira
// profile timezone, so hand-computing one in the browser drifts by the offset
// between the two; and startOfWeek()/startOfMonth() are already the
// convention in getJqlWeekFilter() for exactly that reason.
//
// Jira has no startOfQuarter(), so quarters are built from startOfMonth()
// offsets — a quarter always begins on a month boundary, so the start of the
// quarter containing today is startOfMonth(-(month % 3)). That keeps quarters
// on the same timezone footing as everything else instead of mixing in
// hand-rolled absolute dates.
//
// All the "Last N days" ranges include today, as asked: N days total means
// today plus the N-1 before it, i.e. startOfDay(-(N-1)).
const CLOSED_RANGES = [
  { key:'currentDay',     label:'Current Day',     live:true,  jql:() => `resolved >= startOfDay()` },
  { key:'currentWeek',    label:'Current Week',    live:true,  jql:() => `resolved >= startOfWeek()` },
  { key:'currentMonth',   label:'Current Month',   live:true,  jql:() => `resolved >= startOfMonth()` },
  { key:'currentQuarter', label:'Current Quarter', live:true,  jql:() => `resolved >= ${startOfQuarterJql(0)}` },
  { key:'yesterday',      label:'Yesterday',       live:false, jql:() => `resolved >= startOfDay(-1) AND resolved < startOfDay()` },
  { key:'lastWeek',       label:'Last Week',       live:false, jql:() => `resolved >= startOfWeek(-1) AND resolved < startOfWeek()` },
  { key:'lastMonth',      label:'Last Month',      live:false, jql:() => `resolved >= startOfMonth(-1) AND resolved < startOfMonth()` },
  { key:'lastQuarter',    label:'Last Quarter',    live:false, jql:() => `resolved >= ${startOfQuarterJql(-1)} AND resolved < ${startOfQuarterJql(0)}` },
  { key:'last7',          label:'Last 7 days',     live:true,  jql:() => `resolved >= startOfDay(-6)` },
  { key:'last14',         label:'Last 14 days',    live:true,  jql:() => `resolved >= startOfDay(-13)` },
  { key:'last30',         label:'Last 30 days',    live:true,  jql:() => `resolved >= startOfDay(-29)` },
  { key:'last60',         label:'Last 60 days',    live:true,  jql:() => `resolved >= startOfDay(-59)` },
  { key:'last90',         label:'Last 90 days',    live:true,  jql:() => `resolved >= startOfDay(-89)` },
];
const CLOSED_RANGE_BY_KEY = Object.fromEntries(CLOSED_RANGES.map(r => [r.key, r]));

// Months to step back to land on the first day of a quarter. `back` counts
// whole quarters: 0 = the quarter containing today, -1 = the one before it.
// London's month is used only to work out how far into the quarter we are — a
// value that cannot differ from Jira's own answer by more than the few hours
// either side of a month boundary, unlike a hand-built absolute date.
function startOfQuarterJql(back) {
  const month = Number(new Date().toLocaleDateString('en-GB', { timeZone:'Europe/London', month:'numeric' })) - 1;
  const months = (month % 3) + (-back * 3);
  return months === 0 ? 'startOfMonth()' : `startOfMonth(-${months})`;
}
// Human hint for the two quarter options only ("Jul – Sep 2026"), since
// "Current Quarter" on its own leaves people guessing which months they are
// looking at.
function quarterHint(back) {
  const now = new Date();
  const month = Number(now.toLocaleDateString('en-GB', { timeZone:'Europe/London', month:'numeric' })) - 1;
  const year  = Number(now.toLocaleDateString('en-GB', { timeZone:'Europe/London', year:'numeric' }));
  const firstMonth = month - (month % 3) + (back * 3);
  const start = new Date(Date.UTC(year, firstMonth, 1));
  const end   = new Date(Date.UTC(year, firstMonth + 2, 1));
  const m = d => d.toLocaleDateString('en-GB', { timeZone:'UTC', month:'short' });
  return `${m(start)} – ${m(end)} ${end.getUTCFullYear()}`;
}
function closedRangeHint(key) {
  if (key === 'currentQuarter') return quarterHint(0);
  if (key === 'lastQuarter')    return quarterHint(-1);
  return '';
}

function closedJql(rangeKey) {
  const r = CLOSED_RANGE_BY_KEY[rangeKey] || CLOSED_RANGE_BY_KEY.currentDay;
  // statusCategory = Done is the "closed or resolved" test — see the header
  // note on why, and on the seven reopened tickets it deliberately excludes.
  // TP_FILTER is kept for consistency with the other three views; against
  // live data it excludes nothing from the closed set (387 of 387 over 90
  // days), so it costs nothing here and would matter silently if the Third
  // Party Status values ever changed.
  return `project = TAC AND statusCategory = Done AND ${r.jql()} AND ${TP_FILTER} ORDER BY resolved DESC`;
}

// ── SLA breach state for a closed ticket ──────────────────────────────────────
// resolveSla() answers "is this breaching RIGHT NOW", which every closed
// ticket answers 'completed' to — its clocks have all stopped. The only
// meaningful question here is "did it ever miss", so this reads
// completedCycles too, the same way the Historical tab's getSlaHistStatus()
// does.
//
// Which clocks count is the viewer's choice (selectedClosedSlas), because the
// six differ a lot in strictness: on the 13 tickets closed in the three days
// to 4 Sep 2026, the three headline SLAs put 6 in breach while all six put
// 10 in breach. Defaults to all six.
function slaEverBreached(issue, field) {
  const s = issue.fields?.[field];
  if (!s) return false;
  return (s.completedCycles || []).some(c => c.breached) || !!(s.ongoingCycle && s.ongoingCycle.breached);
}
// Which of the SELECTED SLAs this ticket missed, plus whether it carried data
// for any of them at all — a ticket with no SLA data is neither met nor
// breached and must not be painted green.
function closedSlaState(issue) {
  const chosen = SLA_ALL.filter(f => selectedClosedSlas.has(f));
  const hasData = chosen.some(f => issue.fields?.[f]);
  const breached = chosen.filter(f => slaEverBreached(issue, f)).map(f => SLA_FIELD_NAMES[f]);
  return { hasData, breached, met: hasData && breached.length === 0 };
}
function closedSlaCell(issue) {
  const st = closedSlaState(issue);
  if (!st.hasData) return `<span style="color:var(--grey-300)">—</span>`;
  if (st.breached.length) {
    return `<span class="badge badge-pill" title="${esc('Breached: ' + st.breached.join(', '))}" style="background:var(--red-20);color:var(--aa-red)">`
         + ico('circle-exclamation', 12) + `Breached${st.breached.length > 1 ? ' ×' + st.breached.length : ''}</span>`;
  }
  return `<span class="badge badge-pill" title="No breach on the selected SLAs" style="background:var(--green-30);color:var(--aa-green)">`
       + ico('circle-check', 12) + `Met</span>`;
}

// ── State ────────────────────────────────────────────────────────────────────
let closedRange    = 'currentDay';   // the default the business asked for
let closedAssignee = '';             // '' = everyone
let closedTacTiers = new Set(TAC_TIER_OPTIONS);
let selectedClosedSlas = new Set(SLA_ALL);
let closedPanelOpen = null;          // 'tier' | 'sla' | null — only one at a time
let closedBusy  = false;
let closedError = '';
let closedEverLoaded = false;
let expandedClosedLinks = new Set();

// ── Cache ─────────────────────────────────────────────────────────────────────
// Jira is slow enough that flipping between ranges unmemoised is painful, so
// each range keeps the pages it has fetched. Two deliberate limits, because
// caching a closed queue is easy to overdo:
//
//  - TTL by range kind. A range that includes today keeps changing, so it
//    goes stale fast; a range wholly in the past can only change if somebody
//    edits a resolution date, so it holds much longer. Neither is forever,
//    and nothing is written to localStorage — a stale closed list read off
//    disk on the next visit would be worse than a slow fresh one.
//  - At most CLOSED_CACHE_MAX ranges are retained, evicting least-recently-
//    used. Last Quarter alone can hold thousands of issues with their SLA
//    payloads; keeping every range anyone clicked would grow without bound.
const CLOSED_TTL_LIVE = 2 * 60 * 1000;   // includes today — expect churn
const CLOSED_TTL_PAST = 30 * 60 * 1000;  // finished period — near-immutable
const CLOSED_CACHE_MAX = 4;
const closedCache = new Map();  // rangeKey -> {issues, nextToken, total, fetchedAt}

function closedTtl(rangeKey) {
  return CLOSED_RANGE_BY_KEY[rangeKey]?.live ? CLOSED_TTL_LIVE : CLOSED_TTL_PAST;
}
function closedCacheGet(rangeKey) {
  const e = closedCache.get(rangeKey);
  if (!e) return null;
  if (Date.now() - e.fetchedAt > closedTtl(rangeKey)) { closedCache.delete(rangeKey); return null; }
  // Re-insert to mark most-recently-used (a Map preserves insertion order).
  closedCache.delete(rangeKey); closedCache.set(rangeKey, e);
  return e;
}
function closedCacheSet(rangeKey, entry) {
  closedCache.delete(rangeKey);
  closedCache.set(rangeKey, entry);
  while (closedCache.size > CLOSED_CACHE_MAX) closedCache.delete(closedCache.keys().next().value);
}

// ── Fetching ─────────────────────────────────────────────────────────────────
// One page of OUR pager, not one Jira page. Jira routinely returns far fewer
// rows than maxResults — it shrinks pages when many fields are requested, and
// CLOSED_FIELDS asks for 13 — so a single call would hand back an
// unpredictable handful. This walks nextPageToken until it has
// AT LEAST CLOSED_PAGE_SIZE rows, or Jira runs out. "At least": the running
// total is tested after each append and a Jira page cannot be resumed
// halfway, so one pager page overshoots by up to one Jira page. That is why
// the button says "Load more" instead of promising a number — the note under
// it reports what actually landed.
//
// Only a null/absent nextPageToken ends the walk (jiraNextCursor encodes that
// rule): `isLast` is not a required field in the published schema, and paging
// off it truncated the live queue once already.
const CLOSED_PAGE_SIZE = 100;

async function fetchClosedPage(rangeKey, cursor) {
  const jql = closedJql(rangeKey);
  const out = [];
  let next = cursor || undefined;
  do {
    const params = { cloudId: CLOUD, jql, fields: CLOSED_FIELDS, maxResults: 100 };
    if (next) params.nextPageToken = next;
    let result;
    try { result = await callSearchTool(params); }
    catch (err) { throw new Error(mcpErrorMessage(err)); }
    const r = parseJira(result);
    out.push(...jiraIssueNodes(r));
    next = jiraNextCursor(r);
  } while (next && out.length < CLOSED_PAGE_SIZE);
  return { issues: out, nextToken: next || null };
}

// The pager label ("100 of 5,227") needs a total, and /rest/api/3/search/jql
// deliberately returns none — only a token. /api/count asks Jira's own
// approximate-count endpoint for it. Non-fatal by design: on failure the
// pager falls back to "more available" and the list stays usable.
async function fetchClosedTotal(rangeKey) {
  try {
    const j = await apiFetch('/api/count', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jql: closedJql(rangeKey) }),
    });
    return typeof j?.count === 'number' ? j.count : null;
  } catch (e) { return null; }
}

async function loadClosed(force) {
  const rangeKey = closedRange;
  if (!force) {
    const hit = closedCacheGet(rangeKey);
    if (hit) { closedError = ''; renderClosed(); return; }
  }
  if (force) closedCache.delete(rangeKey);
  closedBusy = true; closedError = ''; expandedClosedLinks = new Set();
  renderClosed();
  try {
    const page = await fetchClosedPage(rangeKey, null);
    // The count runs after the first page rather than alongside it: the page
    // is what the viewer is waiting to see, and a range with nothing closed
    // in it needs no total at all.
    const total = await fetchClosedTotal(rangeKey);
    // The range may have been switched again while this was in flight, so
    // store the result under the range it was fetched FOR and only repaint if
    // that is still the one on screen.
    closedCacheSet(rangeKey, { issues: page.issues, nextToken: page.nextToken, total, fetchedAt: Date.now() });
  } catch (err) {
    if (rangeKey === closedRange) closedError = err.message;
  } finally {
    if (rangeKey === closedRange) { closedBusy = false; renderClosed(); }
  }
}

async function loadMoreClosed(all) {
  const rangeKey = closedRange;
  const entry = closedCacheGet(rangeKey);
  if (!entry || !entry.nextToken || closedBusy) return;
  closedBusy = true; closedError = ''; renderClosed();
  try {
    do {
      const page = await fetchClosedPage(rangeKey, entry.nextToken);
      entry.issues = entry.issues.concat(page.issues);
      entry.nextToken = page.nextToken;
      // Keep the growing entry in the cache and refresh its stamp, so a long
      // "Load all" on a 2-minute-TTL range cannot expire out from under the
      // walk it is in the middle of.
      entry.fetchedAt = Date.now();
      closedCacheSet(rangeKey, entry);
      if (rangeKey === closedRange) renderClosed();
    } while (all && entry.nextToken && rangeKey === closedRange);
  } catch (err) {
    if (rangeKey === closedRange) closedError = err.message;
  } finally {
    if (rangeKey === closedRange) { closedBusy = false; renderClosed(); }
  }
}

// ── Controls ─────────────────────────────────────────────────────────────────
function onClosedRangeChange(value) {
  closedRange = value;
  closedAssignee = '';   // the previously picked person may not appear in the new window
  loadClosed(false);
}
function onClosedAssigneeChange(value) { closedAssignee = value; renderClosedTable(); }
function onClosedRefresh() { loadClosed(true); }

// Both Closed-tab panels share one open slot, so opening the SLA picker
// closes the tier one rather than stacking two overlapping panels.
function toggleClosedPanel(which, e) {
  e.stopPropagation();
  closedPanelOpen = closedPanelOpen === which ? null : which;
  renderClosed();
}
// Closing a panel must not rebuild the Closed tab's controls block. Doing so
// replaces the element the in-flight click is being delivered to, which
// silently swallowed clicks on the "Show summary" tickbox, the assignee select
// and Refresh whenever a panel happened to be open: a checkbox's checkedness
// flips before dispatch, but its `change` event fires in the activation
// behaviour that runs *after* the click finishes propagating — and by then the
// element has been detached, so the handler never reaches the app. Caught
// 4 Sep 2026 while testing the KPI tickbox, which sits next to the SLA panel
// and so is the likeliest control to be clicked with one open.
function closeClosedPanelsOnOutsideClick() {
  if (!closedPanelOpen) return;
  closedPanelOpen = null;
  collapseMultiSelectPanels(document.getElementById('closed-root'));
}
// Same "all selected means unfiltered" rule as the Priority list's tier
// filter: a tier value this build has never seen must not vanish just because
// the default state does not name it.
function closedMatchesTacTier(issue) {
  return closedTacTiers.size === TAC_TIER_OPTIONS.length || closedTacTiers.has(tacTierOf(issue));
}
function onClosedTierCheck(value, checked) {
  if (checked) closedTacTiers.add(value); else closedTacTiers.delete(value);
  renderClosed();
}
// The SLA picker chooses which clocks count towards the red highlight and the
// SLA cell. It deliberately does NOT drop rows: "pick which ones to show"
// scopes the breach test, so a ticket that missed nothing you selected still
// belongs in a list of what closed.
function onClosedSlaCheck(field, checked) {
  if (checked) selectedClosedSlas.add(field); else selectedClosedSlas.delete(field);
  renderClosed();
}
function closedTierButtonLabel() {
  if (closedTacTiers.size === TAC_TIER_OPTIONS.length) return 'TAC Tier: All';
  if (closedTacTiers.size === 0) return 'TAC Tier: None';
  return 'TAC Tier: ' + TAC_TIER_OPTIONS.filter(t => closedTacTiers.has(t)).join(', ');
}
// Six names, the longest 19 characters, so spelling out the selection would
// make this button wider than the whole rest of the control row. A count
// reads at a glance instead; the panel shows which.
function closedSlaButtonLabel() {
  if (selectedClosedSlas.size === SLA_ALL.length) return 'SLA: All 6';
  if (selectedClosedSlas.size === 0) return 'SLA: None';
  return `SLA: ${selectedClosedSlas.size} of ${SLA_ALL.length}`;
}

function closedMultiSelect(which, label, options) {
  const open = closedPanelOpen === which;
  return `<div class="tt-multiselect">
       <button type="button" class="tt-ms-btn${open ? ' is-open' : ''}" onclick="toggleClosedPanel('${which}', event)">
         <span>${esc(label)}</span>${ico('chevron-down', 10)}
       </button>
       ${open ? `<div class="tt-ms-panel${which === 'sla' ? ' is-wide' : ''}" onclick="event.stopPropagation()">
         ${options}
       </div>` : ''}
     </div>`;
}

// ── Render ───────────────────────────────────────────────────────────────────
const CLOSED_THEAD = '<thead><tr><th>Key</th><th>Summary</th><th>Status</th>'
                   + '<th>Priority</th><th>Assignee</th><th>Tier</th><th>SLA</th>'
                   + `<th>Closed <span class="sort-ind">${ico('chevron-down',9)}</span></th></tr></thead>`;
const CLOSED_COLS = 8; // keep in sync with CLOSED_THEAD — the link-drill colspan

function toggleClosedLinkDrill(key) {
  if (expandedClosedLinks.has(key)) expandedClosedLinks.delete(key);
  else expandedClosedLinks.add(key);
  renderClosedTable();
}

function closedRow(issue) {
  const s = issue.fields?.status?.name || '—', p = issue.fields?.priority?.name || '—', pc = priColor(p);
  const links = Array.isArray(issue.fields?.issuelinks) ? issue.fields.issuelinks : [];
  const isOpen = expandedClosedLinks.has(issue.key);
  const st = closedSlaState(issue);
  // The link control appears whenever there is something to show. Unlike the
  // Priority list it is not gated on a status: there, the point is that an
  // Awaiting Internal Team ticket with NO links is itself worth surfacing, so
  // the button shows a zero. Here a closed ticket with no linked work is
  // simply unremarkable, and a column of "0" buttons would be noise.
  const linkBtn = links.length
    ? `<button class="link-btn${isOpen ? ' is-active' : ''}" title="${links.length} linked work item${links.length !== 1 ? 's' : ''}" onclick="toggleClosedLinkDrill('${esc(issue.key)}')">${ico('link', 10)}<span class="link-count">${links.length}</span></button>`
    : '';
  const main = `<tr data-ticket="${esc(issue.key)}"${st.breached.length ? ' class="row-breach"' : ''}>
    <td><a class="t-key" href="${JIRA_BASE}/${issue.key}" target="_blank" rel="noopener">${esc(issue.key)}</a></td>
    <td class="t-sum">${esc(issue.fields?.summary || '—')}</td>
    <td>${badge(s, sBg(s), sFg(s), null, true)}${linkBtn}</td>
    <td>${badge(p, pc.bg, pc.fg)}</td>
    <td class="t-sm">${esc(issue.fields?.assignee?.displayName || 'Unassigned')}</td>
    <td class="t-sm">${esc(tacTierOf(issue) || '—')}</td>
    <td>${closedSlaCell(issue)}</td>
    <td class="t-sm">${fmtShortDateTime(issue.fields?.resolutiondate)}</td>
  </tr>`;
  return main + (isOpen ? linkDrillRow(issue, links, CLOSED_COLS) : '');
}

// ── Closed list: KPI summary strip ───────────────────────────────────────────
// Off by default, revealed by the "Show summary" tickbox, and it summarises
// exactly the rows the current filters are showing — the same `shown` array
// the table renders, so personal mode, the assignee picker and the TAC Tier
// filter all feed straight into it.
//
// Deliberately NOT affected by the SLA multi-select: that control scopes which
// clocks turn a row red, whereas these tiles report four SLAs by name. Letting
// the picker blank out a named tile would be a different feature.
//
// "% Solved by First Agent" was asked for and then withdrawn — the honest
// answers available from list data are all proxies (never-escalated-past-1.5,
// or the TAC Tier field, which disagree with each other on real tickets) and a
// true per-agent measure needs the changelog, i.e. one request per ticket.
// Left out until there is a definition worth trusting.
const CLOSED_KPI_SLAS = [
  { field: 'customfield_10879', label: 'SLA Triage' },
  { field: 'customfield_10967', label: 'SLA First Response' },
  { field: 'customfield_10906', label: 'SLA Response' },
  { field: 'customfield_10969', label: 'SLA Resolution' },
];

let showClosedKpis = false;
function onShowClosedKpisChange(checked) {
  showClosedKpis = checked;
  renderClosedTable();
}

// Attainment for one SLA across a set of tickets: met / had-data.
//
// The denominator is tickets that actually carry a cycle for that SLA, not the
// whole set — a ticket with no Response Target cycle has neither met nor
// missed it, and counting it either way would be a lie. The tile prints the
// denominator for that reason. On the 47 tickets closed in the 14 days to
// 4 Sep 2026 all four SLAs happened to be present on every ticket, but
// Restoration was absent on 8 of 13 in an earlier sample, so uneven
// denominators are real.
//
// "Met" is ticket-level: any breached cycle counts the ticket as missed, which
// is how the Historical tab's SLA figure already works. It matters only for
// Response Target, the one SLA that runs repeatedly (15 of 47 tickets had more
// than one cycle) — and measured per-cycle instead that sample gave 72% too,
// the same answer, so the two definitions are not far apart in practice.
function closedSlaAttainment(tickets, field) {
  const withData = tickets.filter(i => i.fields?.[field]);
  const met = withData.filter(i => !slaEverBreached(i, field)).length;
  return {
    withData: withData.length,
    met,
    noData: tickets.length - withData.length,
    pct: withData.length ? Math.round(met / withData.length * 100) : null,
  };
}

// Overall SLA attainment across whatever the SLA multi-select has selected,
// counted **per ticket**: a ticket that misses ANY selected SLA is a breached
// ticket, however many of its other clocks were met. Ten tickets with one
// bad ticket is 90%.
//
// This is the one tile that follows that picker — the four named tiles below
// are fixed by definition, and this answers "what proportion of these tickets
// came out clean across the clocks I care about".
//
// The breach test is `closedSlaState()`, the same call that decides whether a
// row is tinted red, so this figure is exactly 100% minus the proportion of
// red rows. Tying it to the row highlighting rather than recomputing is the
// point: a headline number that disagreed with the rows underneath it would be
// worse than no number.
//
// The denominator is every ticket shown, not just those carrying SLA data — a
// ticket with no SLA at all breaches nothing and so counts as clean. No such
// ticket exists in TAC today (all 47 closed in the fortnight to 4 Sep 2026
// carried all six clocks), but the sub-line reports the count if any turn up,
// because silently counting them as successes would flatter the number.
//
// Superseded: this started out aggregating ticket-SLA pairs — the per-SLA
// numerators and denominators summed, giving 224 of 282 = 79% on that sample.
// That is a different question ("what proportion of all SLA measurements were
// met") and the business wanted this one, which is 21 of 47 = 45% on the same
// data. Being lower than every component tile is expected, not a bug:
// requiring a ticket to meet ALL selected SLAs is strictly harder than
// meeting any one of them.
function closedSlaTotal(tickets) {
  const slaCount = SLA_ALL.filter(f => selectedClosedSlas.has(f)).length;
  // With nothing selected there is no question to answer. Guarded first
  // because closedSlaState() finds no breaches in that state, which would
  // otherwise read as a perfect 100%.
  if (!slaCount) return { clean: 0, breached: 0, total: tickets.length, noData: 0, slaCount: 0, pct: null };
  const breached = tickets.filter(i => closedSlaState(i).breached.length > 0).length;
  const noData = tickets.filter(i => !closedSlaState(i).hasData).length;
  return {
    clean: tickets.length - breached,
    breached,
    total: tickets.length,
    noData,
    slaCount,
    pct: tickets.length ? Math.round((tickets.length - breached) / tickets.length * 100) : null,
  };
}

function closedKpiHtml(shown, entry) {
  const rangeLabel = (CLOSED_RANGE_BY_KEY[closedRange]?.label || '').toLowerCase();
  // Say what the number is over. When the pager still has rows to fetch, every
  // tile here describes the loaded slice rather than the whole range, and that
  // has to be on screen next to the figures rather than only in the pager.
  const partial = !!entry.nextToken;
  const totalSub = partial
    ? `${rangeLabel} · ${entry.issues.length.toLocaleString('en-GB')} of `
      + `${entry.total != null ? entry.total.toLocaleString('en-GB') : 'more'} loaded`
    : rangeLabel;

  const tiles = [`<div class="tile is-static">
      <div class="tile-header">Total closed</div>
      <div class="tile-count">${shown.length.toLocaleString('en-GB')}</div>
      <div class="tile-sub">${esc(totalSub)}</div>
    </div>`];

  const tot = closedSlaTotal(shown);
  const totSub = tot.slaCount === 0
    ? 'no SLAs selected'
    : tot.total
      ? `${tot.clean} of ${tot.total} met all · ${tot.slaCount} SLA${tot.slaCount !== 1 ? 's' : ''}`
        + (tot.noData ? ` · ${tot.noData} no SLA data` : '')
      : `${tot.slaCount} SLA${tot.slaCount !== 1 ? 's' : ''} selected`;
  tiles.push(`<div class="tile is-static">
      <div class="tile-header">SLA Total</div>
      <div class="tile-count" style="color:${slaPctColour(tot.pct)}">${tot.pct != null ? tot.pct + '%' : '—'}</div>
      <div class="tile-sub">${esc(totSub)}</div>
    </div>`);

  for (const { field, label } of CLOSED_KPI_SLAS) {
    const a = closedSlaAttainment(shown, field);
    const sub = a.withData
      ? `${a.met} of ${a.withData} met` + (a.noData ? ` · ${a.noData} no data` : '')
      : 'no SLA data';
    tiles.push(`<div class="tile is-static">
      <div class="tile-header">${esc(label)}</div>
      <div class="tile-count" style="color:${slaPctColour(a.pct)}">${a.pct != null ? a.pct + '%' : '—'}</div>
      <div class="tile-sub">${esc(sub)}</div>
    </div>`);
  }
  return `<div class="cl-kpis">${tiles.join('')}</div>`;
}

function renderClosed() {
  const el = document.getElementById('closed-root');
  if (!el) return;
  const entry = closedCacheGet(closedRange);

  const rangeOptions = CLOSED_RANGES.map(r => {
    const hint = closedRangeHint(r.key);
    return `<option value="${r.key}"${r.key === closedRange ? ' selected' : ''}>`
         + esc(r.label) + (hint ? ` (${esc(hint)})` : '') + `</option>`;
  }).join('');

  // Assignee options come from the loaded set, which is all this view has —
  // see the pager note about filters only seeing what is loaded.
  const loaded = entry ? personalFilter(entry.issues) : [];
  const counts = tally(loaded, assigneeName);
  const names = Object.keys(counts).sort((a, b) =>
    a === 'Unassigned' ? 1 : b === 'Unassigned' ? -1 : a.localeCompare(b));
  if (closedAssignee && !counts[closedAssignee]) closedAssignee = '';
  const assigneeOptions = [`<option value="">All assignees (${loaded.length})</option>`]
    .concat(names.map(n => `<option value="${esc(n)}"${n === closedAssignee ? ' selected' : ''}>${esc(n)} (${counts[n]})</option>`))
    .join('');

  const tierPanel = TAC_TIER_OPTIONS.map(t => `<label class="tt-ms-option">
           <input type="checkbox" ${closedTacTiers.has(t) ? 'checked' : ''} onchange="onClosedTierCheck('${t}', this.checked)">
           <span>${esc(t)}</span>
         </label>`).join('');
  const slaPanel = SLA_ALL.map(f => `<label class="tt-ms-option">
           <input type="checkbox" ${selectedClosedSlas.has(f) ? 'checked' : ''} onchange="onClosedSlaCheck('${f}', this.checked)">
           <span>${esc(SLA_FIELD_NAMES[f] || f)}</span>
         </label>`).join('');

  const assigneeControl = (personalMode && personalUser)
    ? `<span class="pm-chip">${ico('user',11)}Your tickets only</span>`
    : `<label class="pc-label" for="closed-assignee">Assignee</label>
       <div class="pc-select-wrap">
         <select class="pc-select" id="closed-assignee" onchange="onClosedAssigneeChange(this.value)">${assigneeOptions}</select>
         ${ico('chevron-down', 10)}
       </div>`;

  el.innerHTML = `
    ${personalBanner()}
    <div class="priority-controls">
      <label class="pc-label" for="closed-range">Closed</label>
      <div class="pc-select-wrap">
        <select class="pc-select" id="closed-range" onchange="onClosedRangeChange(this.value)">${rangeOptions}</select>
        ${ico('chevron-down', 10)}
      </div>
      ${assigneeControl}
      ${closedMultiSelect('tier', closedTierButtonLabel(), tierPanel)}
      ${closedMultiSelect('sla', closedSlaButtonLabel(), slaPanel)}
      <label class="pc-checkbox">
        <input type="checkbox" ${showClosedKpis ? 'checked' : ''} onchange="onShowClosedKpisChange(this.checked)">
        <span>Show summary</span>
      </label>
      <button class="cl-btn" onclick="onClosedRefresh()"${closedBusy ? ' disabled' : ''} title="Discard the cached result for this range and re-query Jira">
        <span>${closedBusy ? 'Refreshing…' : 'Refresh'}</span>
      </button>
      <span class="priority-summary" id="closed-summary"></span>
    </div>
    ${closedError ? errorHtml(closedError) : ''}
    <div id="closed-table"></div>`;

  if (!entry) {
    document.getElementById('closed-table').innerHTML = closedBusy
      ? '<div class="loading-state"><div class="spinner"></div><span>Loading closed tickets…</span></div>'
      : (closedError ? '' : '<div class="empty">No data loaded.</div>');
    return;
  }
  renderClosedTable();
}

function renderClosedTable() {
  const table   = document.getElementById('closed-table');
  const summary = document.getElementById('closed-summary');
  if (!table) return;
  const entry = closedCacheGet(closedRange);
  if (!entry) return;

  const loadedAll = personalFilter(entry.issues);
  let shown = closedAssignee ? loadedAll.filter(i => assigneeName(i) === closedAssignee) : loadedAll;
  shown = shown.filter(closedMatchesTacTier);
  // Jira already returns ORDER BY resolved DESC, but the pager concatenates
  // pages and the filters above reorder nothing — sorting anyway makes
  // "most recent at the top" hold however the set was assembled.
  shown = shown.slice().sort((a, b) =>
    new Date(b.fields?.resolutiondate || 0) - new Date(a.fields?.resolutiondate || 0));

  const breachedN = shown.filter(i => closedSlaState(i).breached.length).length;
  // Built before the early return below so the strip shows on an empty result
  // too — "Total closed 0" for a filter combination is itself the answer.
  const kpis = showClosedKpis ? closedKpiHtml(shown, entry) : '';
  const more = !!entry.nextToken;
  const rangeLabel = CLOSED_RANGE_BY_KEY[closedRange]?.label || '';

  if (summary) {
    const totalTxt = entry.total != null ? ` of ${entry.total.toLocaleString('en-GB')}` : '';
    summary.textContent =
      `${shown.length.toLocaleString('en-GB')}${totalTxt} closed ticket${shown.length !== 1 ? 's' : ''}`
      + ` · ${rangeLabel.toLowerCase()}`
      + (breachedN ? ` · ${breachedN} breached an SLA` : '')
      + (more ? ' · filters apply to what is loaded' : '');
  }

  if (!shown.length) {
    const msg = closedTacTiers.size === 0
      ? 'No TAC Tier selected. Check at least one tier above to see tickets.'
      : closedAssignee
        ? `No closed tickets for ${esc(closedAssignee)} in this range.`
        : entry.issues.length
          ? 'No closed tickets match the current filters.'
          : `No tickets were closed in the selected range (${esc(rangeLabel.toLowerCase())}).`;
    table.innerHTML = kpis + `<div class="empty">${msg}</div>` + closedPager(entry, shown.length);
    return;
  }
  table.innerHTML = kpis
                  + `<div class="scroll-x"><table class="tbl">${CLOSED_THEAD}`
                  + `<tbody>${shown.map(closedRow).join('')}</tbody></table></div>`
                  + closedPager(entry, shown.length);
}

// Forward-only pager. A Jira nextPageToken cannot be walked backwards or
// jumped, so this loads cumulatively rather than offering numbered pages —
// which suits a newest-first list anyway: page one is always the tickets
// people actually came for.
function closedPager(entry, shownCount) {
  if (!entry.nextToken) {
    // Nothing left to fetch; only worth saying so if a pager was ever in play.
    return entry.issues.length > CLOSED_PAGE_SIZE
      ? `<div class="cl-pager"><span class="cl-pager-note">All ${entry.issues.length.toLocaleString('en-GB')} loaded.</span></div>`
      : '';
  }
  const remaining = entry.total != null ? Math.max(0, entry.total - entry.issues.length) : null;
  const remTxt = remaining != null ? remaining.toLocaleString('en-GB') : 'the rest';
  const busy = closedBusy ? ' disabled' : '';
  const filterNote = shownCount !== entry.issues.length
    ? ` · ${shownCount.toLocaleString('en-GB')} shown after filters`
    : '';
  return `<div class="cl-pager">
    <button class="cl-btn"${busy} onclick="loadMoreClosed(false)">
      ${ico('chevron-down', 12)}<span>${closedBusy ? 'Loading…' : 'Load more'}</span>
    </button>
    <button class="cl-btn"${busy} onclick="loadMoreClosed(true)">
      <span>Load all remaining (${remTxt})</span>
    </button>
    <span class="cl-pager-note">${entry.issues.length.toLocaleString('en-GB')} loaded${entry.total != null ? ' of ' + entry.total.toLocaleString('en-GB') : ''}${filterNote}. The filters and the assignee list only see what is loaded.</span>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// ── Ticket detail: history timeline ───────────────────────────────────────────
// Click any row in any ticket table and get the ticket's history: every field
// change with who made it and when, when it changed hands, and when each SLA
// clock ran, stopped or was missed.
//
// This needs the Jira **changelog**, which no list query returns — not as a
// field, not via any expand on /search/jql. It is a per-issue read, hence
// /api/issue/:key (+ /changelog for the overflow past the inlined 100).
//
// Two things about the TAC workflow that shaped this:
//
//  - **"Owner" is not `assignee`.** There are three separate owner fields —
//    `1.5 TAC Owner` (customfield_10859), `2.0` (…860) and `2.5` (…861) — and
//    they are what the TAC escalation path actually moves between people.
//    A timeline that only watched `assignee` would miss most hand-offs.
//  - **Most history is written by automation.** On TAC-5400, 23 of 39 entries
//    were made by "Automation for Jira" or "Atlassian Assist" rather than a
//    person. Jira reports that as `author.accountType === 'app'`, so bot
//    entries are marked rather than silently attributed to a human.
// ═══════════════════════════════════════════════════════════════════════════

// The three tier owner fields, in escalation order.
const TAC_OWNER_FIELDS = {
  customfield_10859: '1.5 TAC Owner',
  customfield_10860: '2.0 TAC Owner',
  customfield_10861: '2.5 TAC Owner',
};

// Shown by default in the timeline. Everything else in the changelog — and
// there is a lot of it: Sentiment, Impact, Severity, Classification, Request
// participants, attachments, Scheduled Date, form fields — is behind the
// "Show all changes" tickbox. Keyed by the changelog item's `fieldId`, with a
// fallback to its display `field` name for entries that carry no id.
const SIGNIFICANT_FIELD_IDS = new Set([
  'status', 'assignee', 'priority', 'resolution',
  TAC_TIER_FIELD, ...Object.keys(TAC_OWNER_FIELDS),
]);
const SIGNIFICANT_FIELD_NAMES = new Set([
  'status', 'assignee', 'priority', 'resolution', 'TAC Tier',
  ...Object.values(TAC_OWNER_FIELDS),
]);
function isSignificantChange(item) {
  if (item.fieldId && SIGNIFICANT_FIELD_IDS.has(item.fieldId)) return true;
  return SIGNIFICANT_FIELD_NAMES.has(item.field);
}
// Owner and assignee changes are the "changed hands" events, coloured apart
// from ordinary field edits.
function isOwnershipChange(item) {
  return item.fieldId === 'assignee' || !!TAC_OWNER_FIELDS[item.fieldId]
      || item.field === 'assignee' || Object.values(TAC_OWNER_FIELDS).includes(item.field);
}

// ── State & cache ────────────────────────────────────────────────────────────
let detailKey     = null;    // the open ticket, or null when the overlay is shut
let detailData    = null;    // { fields, histories }
let detailBusy    = false;
let detailError   = '';
let detailShowAll = false;   // the "Show all changes" tickbox

// Per-ticket cache. A timeline is read repeatedly while working a queue —
// open, close, open the next, come back — and the changelog is two round trips
// for a busy ticket. Same shape of ceiling as the Closed list's cache: a short
// TTL because a ticket being worked changes under you, and a hard cap because
// a changelog plus six SLA payloads is not small.
const DETAIL_TTL = 3 * 60 * 1000;
const DETAIL_CACHE_MAX = 10;
const detailCache = new Map();   // key -> { data, fetchedAt }

function detailCacheGet(key) {
  const e = detailCache.get(key);
  if (!e) return null;
  if (Date.now() - e.fetchedAt > DETAIL_TTL) { detailCache.delete(key); return null; }
  detailCache.delete(key); detailCache.set(key, e);   // mark most-recently-used
  return e.data;
}
function detailCacheSet(key, data) {
  detailCache.delete(key);
  detailCache.set(key, { data, fetchedAt: Date.now() });
  while (detailCache.size > DETAIL_CACHE_MAX) detailCache.delete(detailCache.keys().next().value);
}

// ── Fetch ────────────────────────────────────────────────────────────────────
// `expand=changelog` inlines at most 100 entries but reports the true count in
// `changelog.total`, so a longer history needs the dedicated endpoint walked.
// No ticket seen so far comes close (TAC-5400, the busiest, has 39), but a
// silent truncation would be indistinguishable from "nothing else happened" —
// which is the failure mode this whole file keeps running into.
async function fetchIssueDetail(key) {
  const issue = await apiFetch('/api/issue/' + encodeURIComponent(key));
  const cl = issue.changelog || {};
  let histories = Array.isArray(cl.histories) ? cl.histories.slice() : [];
  const total = typeof cl.total === 'number' ? cl.total : histories.length;
  while (histories.length < total) {
    const page = await apiFetch(`/api/issue/${encodeURIComponent(key)}/changelog?startAt=${histories.length}`);
    const values = Array.isArray(page.values) ? page.values : [];
    if (!values.length) break;   // never spin if Jira stops handing rows back
    histories = histories.concat(values);
  }
  return { fields: issue.fields || {}, histories };
}

async function openTicketDetail(key) {
  detailKey = key;
  detailError = '';
  detailShowAll = false;
  const hit = detailCacheGet(key);
  if (hit) { detailData = hit; detailBusy = false; renderTicketDetail(); return; }
  detailData = null; detailBusy = true;
  renderTicketDetail();
  try {
    const data = await fetchIssueDetail(key);
    detailCacheSet(key, data);
    // Guard against a slow fetch landing after the user closed the overlay or
    // opened a different ticket.
    if (detailKey !== key) return;
    detailData = data;
  } catch (err) {
    if (detailKey !== key) return;
    detailError = mcpErrorMessage(err);
  } finally {
    if (detailKey === key) { detailBusy = false; renderTicketDetail(); }
  }
}

function closeTicketDetail() {
  detailKey = null; detailData = null; detailError = ''; detailBusy = false;
  document.getElementById('td-scrim')?.remove();
  document.body.style.overflow = '';
}
function onDetailShowAllChange(checked) { detailShowAll = checked; renderTicketDetail(); }

// One document-level listener rather than an onclick per row, so every ticket
// table — present and future — gets this for free from just a `data-ticket`
// attribute. Clicks on an <a> or <button> inside the row are left alone: that
// is what keeps the key's Jira link and the linked-tickets toggle working.
function onTicketRowClick(e) {
  if (e.target.closest('a, button, input, label, select')) return;
  const row = e.target.closest('[data-ticket]');
  if (!row) return;
  openTicketDetail(row.getAttribute('data-ticket'));
}
function onDetailKeydown(e) {
  if (e.key === 'Escape' && detailKey) closeTicketDetail();
}

// ── Timeline construction ────────────────────────────────────────────────────
// Merges three sources into one list, newest first:
//   1. the ticket being created,
//   2. each changelog entry (one per author+timestamp, carrying its items),
//   3. the moment each SLA cycle was breached.
//
// SLA *starts* and *stops* deliberately do NOT become timeline events: every
// clock starts within a second of the ticket being created, so six near-
// identical "started" entries would bury the changes worth reading. The full
// cycle detail lives in its own section instead (slaCycleRows), which is the
// better answer to "which clocks ran and when" anyway. Breaches DO belong in
// the timeline — seeing a miss land between two status changes is the point.
function slaCycles(issue) {
  const out = [];
  for (const field of SLA_ALL) {
    const sla = issue.fields?.[field];
    if (!sla) continue;
    const name = sla.name || SLA_FIELD_NAMES[field] || field;
    (sla.completedCycles || []).forEach(c => out.push({ field, name, cycle: c, ongoing: false }));
    if (sla.ongoingCycle) out.push({ field, name, cycle: sla.ongoingCycle, ongoing: true });
  }
  return out;
}

function buildTicketTimeline(data, showAll) {
  const events = [];
  const created = data.fields?.created;
  if (created) {
    events.push({
      at: new Date(created).getTime(),
      kind: 'created',
      who: data.fields?.reporter?.displayName || null,
      bot: false,
    });
  }
  for (const h of data.histories || []) {
    const items = (h.items || []).filter(it => showAll || isSignificantChange(it));
    // A history entry whose every item was filtered out contributes nothing —
    // dropping it here is what stops the default view showing empty rows.
    if (!items.length) continue;
    events.push({
      at: new Date(h.created).getTime(),
      kind: 'change',
      who: h.author?.displayName || 'Unknown',
      bot: h.author?.accountType === 'app',
      items,
      ownership: items.some(isOwnershipChange),
    });
  }
  for (const c of slaCycles(data)) {
    // Only a breach that has actually happened: an ongoing cycle carries a
    // breachTime in the FUTURE (the deadline), which is not an event.
    const bt = c.cycle.breachTime?.epochMillis;
    if (!c.cycle.breached || bt == null || bt > Date.now()) continue;
    events.push({ at: bt, kind: 'breach', slaName: c.name, ongoing: c.ongoing });
  }
  // Newest first, matching Jira's own history order and the rest of this
  // dashboard. Ties broken so a breach reads after the change that caused it.
  const rank = { breach: 0, change: 1, created: 2 };
  events.sort((a, b) => b.at - a.at || (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9));
  return events;
}

// ── Time in status ───────────────────────────────────────────────────────────
// Derived from the status transitions in the changelog. The first status is
// read off the earliest transition's `fromString` — Jira does not record the
// opening status as a change, so it is only recoverable that way.
//
// The window ends at the last recorded activity for a finished ticket, and at
// "now" for a live one. Using the resolution date instead would silently drop
// anything that happened after it, which is exactly the case for the seven
// tickets that were resolved and then reopened (see section 2 of CLAUDE.md).
function timeInStatus(data) {
  const createdAt = data.fields?.created ? new Date(data.fields.created).getTime() : null;
  if (!createdAt) return null;
  const changes = [];
  for (const h of data.histories || []) {
    for (const it of h.items || []) {
      if (it.field === 'status' || it.fieldId === 'status') {
        changes.push({ at: new Date(h.created).getTime(), from: it.fromString, to: it.toString });
      }
    }
  }
  changes.sort((a, b) => a.at - b.at);
  const isDone = data.fields?.status?.statusCategory?.key === 'done';
  const lastActivity = (data.histories || []).reduce(
    (m, h) => Math.max(m, new Date(h.created).getTime()), createdAt);
  const endAt = isDone ? Math.max(lastActivity, createdAt) : Date.now();

  const periods = [];
  let cursor = createdAt;
  let current = changes.length ? changes[0].from : (data.fields?.status?.name || '—');
  for (const c of changes) {
    if (c.at > cursor) periods.push({ status: current, ms: c.at - cursor });
    cursor = c.at; current = c.to;
  }
  if (endAt > cursor) periods.push({ status: current, ms: endAt - cursor });

  // Collapse repeat visits to the same status into one total — "9d across 3
  // visits" is the useful figure, not three separate slivers.
  const totals = new Map();
  for (const p of periods) {
    const e = totals.get(p.status) || { status: p.status, ms: 0, visits: 0 };
    e.ms += p.ms; e.visits++;
    totals.set(p.status, e);
  }
  const rows = [...totals.values()].sort((a, b) => b.ms - a.ms);
  const total = rows.reduce((s, r) => s + r.ms, 0);
  return { rows, total, isDone, endAt };
}

// ── Render ───────────────────────────────────────────────────────────────────
function detailOwnerName(issue, field) { return issue.fields?.[field]?.displayName || null; }

// A changelog value is `toString`/`fromString` — already the human-readable
// form Jira rendered at the time, so an option renamed since still reads as
// whatever it was called then. Empty means "was not set".
function changeValue(v) {
  return v == null || v === ''
    ? `<span class="td-ch-v is-none">none</span>`
    : `<span class="td-ch-v">${esc(v)}</span>`;
}
function changeLine(item) {
  const label = TAC_OWNER_FIELDS[item.fieldId] || item.field || item.fieldId || 'field';
  return `<div class="td-ch">`
       + `<span class="td-ch-f">${esc(label)}</span>`
       + changeValue(item.fromString)
       + `<span class="td-ch-arrow">${ico('chevron-right', 10)}</span>`
       + changeValue(item.toString)
       + `</div>`;
}

function detailEventHtml(ev, prev) {
  // `prev` is the next-OLDER event, so this reads "N after the previous
  // change" — the thing that makes a three-week silence visible.
  const gap = prev && ev.at > prev.at ? ev.at - prev.at : null;
  const when = `<div class="td-ev-when">${esc(fmtShortDateTime(new Date(ev.at).toISOString()))}`
             + (gap && gap >= 3600000 ? ` · ${esc(formatDuration(gap))} after previous` : '')
             + `</div>`;
  if (ev.kind === 'created') {
    return `<div class="td-ev is-created"><div class="td-ev-dot"></div>${when}`
         + `<div class="td-ev-who">${ico('circle-check', 12)}Ticket created`
         + (ev.who ? ` <span style="font-weight:500;color:var(--fg-3)">by ${esc(ev.who)}</span>` : '')
         + `</div></div>`;
  }
  if (ev.kind === 'breach') {
    return `<div class="td-ev is-breach"><div class="td-ev-dot"></div>${when}`
         + `<div class="td-ev-who" style="color:var(--aa-red)">${ico('circle-exclamation', 12)}`
         + `${esc(ev.slaName)} breached</div>`
         + `<div class="td-sla-line"><span class="td-sla-meta">`
         + (ev.ongoing ? 'Clock was still running at this point' : 'Target missed while the clock ran')
         + `</span></div></div>`;
  }
  const cls = ev.ownership ? ' is-owner' : '';
  return `<div class="td-ev${cls}"><div class="td-ev-dot"></div>${when}`
       + `<div class="td-ev-who">${ico('user', 12)}${esc(ev.who)}`
       + (ev.bot ? `<span class="td-ev-bot">auto</span>` : '')
       + `</div>`
       + ev.items.map(changeLine).join('')
       + `</div>`;
}

// One row per SLA cycle: when it ran, what it was aiming at, what it took.
// This is the direct answer to "which SLAs were ticking and when" — including
// the clocks that never breached, which the timeline never mentions.
function slaCycleRows(issue) {
  const cycles = slaCycles(issue);
  if (!cycles.length) return `<div class="empty-inline">No SLA data on this ticket</div>`;
  cycles.sort((a, b) => (a.cycle.startTime?.epochMillis || 0) - (b.cycle.startTime?.epochMillis || 0));
  const rows = cycles.map(c => {
    const cy = c.cycle;
    const started = cy.startTime?.epochMillis;
    const stopped = cy.stopTime?.epochMillis;
    const goal = cy.goalDuration?.millis;
    const elapsed = cy.elapsedTime?.millis;
    // An ongoing cycle's breachTime is a deadline, not a past event.
    const breachedNow = !!cy.breached;
    const outcome = c.ongoing
      ? (breachedNow
          ? badge('Breached', 'var(--red-20)', 'var(--aa-red)', 'circle-exclamation', true)
          : cy.paused
            ? badge('Paused', 'var(--grey-100)', 'var(--grey-600)', 'circle-minus', true)
            : badge('Running', 'var(--primary-30)', 'var(--aa-primary)', 'clock', true))
      : (breachedNow
          ? badge('Breached', 'var(--red-20)', 'var(--aa-red)', 'circle-exclamation', true)
          : badge('Met', 'var(--green-30)', 'var(--aa-green)', 'circle-check', true));
    return `<tr>
      <td class="t-sm">${esc(c.name)}</td>
      <td class="t-sm">${started != null ? esc(fmtShortDateTime(new Date(started).toISOString())) : '—'}</td>
      <td class="t-sm">${c.ongoing
          ? `<span style="color:var(--fg-4)">still open</span>`
          : (stopped != null ? esc(fmtShortDateTime(new Date(stopped).toISOString())) : '—')}</td>
      <td class="t-sm">${goal != null ? esc(formatDuration(goal)) : '—'}</td>
      <td class="t-sm">${elapsed != null ? esc(formatDuration(elapsed)) : '—'}</td>
      <td>${outcome}</td>
    </tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="tbl">
    <thead><tr><th>SLA</th><th>Started</th><th>Stopped</th><th>Goal</th><th>Elapsed</th><th>Outcome</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function timeInStatusHtml(tis) {
  if (!tis || !tis.rows.length || !tis.total) return '';
  const segs = tis.rows.map(r =>
    `<div class="td-tis-seg" style="width:${(r.ms / tis.total * 100).toFixed(2)}%;background:${sCol(r.status)}" `
  + `title="${esc(r.status)} — ${esc(formatDuration(r.ms))}"></div>`).join('');
  const legend = tis.rows.map(r =>
    `<span class="td-tis-item"><span class="td-tis-dot" style="background:${sCol(r.status)}"></span>`
  + `${esc(r.status)} <b>${esc(formatDuration(r.ms))}</b>`
  + (r.visits > 1 ? ` <span style="color:var(--fg-4)">×${r.visits}</span>` : '')
  + `</span>`).join('');
  return `<div class="td-tis">
    <div class="td-section-h">Time in status
      <span style="font-weight:500;color:var(--fg-4)">
        ${esc(formatDuration(tis.total))} total, creation to ${tis.isDone ? 'last activity' : 'now'}
      </span>
    </div>
    <div class="td-tis-bar">${segs}</div>
    <div class="td-tis-legend">${legend}</div>
  </div>`;
}

function detailFactsHtml(issue) {
  const f = issue.fields || {};
  const owners = Object.entries(TAC_OWNER_FIELDS)
    .map(([field, label]) => ({ label, name: detailOwnerName(issue, field) }))
    .filter(o => o.name);
  const facts = [
    ['Assignee', f.assignee?.displayName || 'Unassigned'],
    ['Reporter', f.reporter?.displayName || '—'],
    ...owners.map(o => [o.label, o.name]),
    ['TAC Tier', f[TAC_TIER_FIELD]?.value || '—'],
    ['Organisation', (f.customfield_10002 || [])[0]?.name || '—'],
    ['Product', f.customfield_10854?.value || '—'],
    ['Created', fmtShortDateTime(f.created)],
    ['Last updated', fmtShortDateTime(f.updated)],
  ];
  if (f.resolutiondate) facts.push(['Closed', fmtShortDateTime(f.resolutiondate)]);
  if (f.resolution?.name) facts.push(['Resolution', f.resolution.name]);
  return `<div class="td-facts">` + facts.map(([k, v]) =>
    `<div><div class="td-fact-k">${esc(k)}</div><div class="td-fact-v">${esc(v)}</div></div>`).join('')
  + `</div>`;
}

function renderTicketDetail() {
  if (!detailKey) { closeTicketDetail(); return; }
  let scrim = document.getElementById('td-scrim');
  if (!scrim) {
    scrim = document.createElement('div');
    scrim.id = 'td-scrim';
    scrim.className = 'td-scrim';
    // Only a click on the scrim itself closes — a click that started inside
    // the modal and happens to bubble here must not.
    scrim.addEventListener('click', e => { if (e.target === scrim) closeTicketDetail(); });
    document.body.appendChild(scrim);
    document.body.style.overflow = 'hidden';
  }

  const key = detailKey;
  const head = `<div class="td-head">
      <div class="td-head-main">
        <a class="td-key" href="${JIRA_BASE}/${esc(key)}" target="_blank" rel="noopener">
          ${esc(key)}${ico('link', 11)}
        </a>
        <div class="td-title" id="td-title">${detailData ? esc(detailData.fields?.summary || '—') : 'Loading…'}</div>
        <div class="td-badges" id="td-badges"></div>
      </div>
      <button class="icon-btn" title="Close (Esc)" onclick="closeTicketDetail()">${ico('xmark', 15)}</button>
    </div>`;

  if (detailBusy || (!detailData && !detailError)) {
    scrim.innerHTML = `<div class="td-modal" role="dialog" aria-modal="true" aria-label="Ticket ${esc(key)}">
      ${head}
      <div class="td-body"><div class="loading-state"><div class="spinner"></div><span>Loading ${esc(key)} history…</span></div></div>
    </div>`;
    return;
  }
  if (detailError) {
    scrim.innerHTML = `<div class="td-modal" role="dialog" aria-modal="true" aria-label="Ticket ${esc(key)}">
      ${head}<div class="td-body">${errorHtml(detailError)}</div></div>`;
    return;
  }

  const issue = detailData;
  const f = issue.fields || {};
  const s = f.status?.name || '—', p = f.priority?.name || '—', pc = priColor(p);
  const events = buildTicketTimeline(issue, detailShowAll);
  const tis = timeInStatus(issue);
  // What the tickbox would reveal, so it says what it does rather than making
  // you toggle it to find out. Counted in CHANGES, not events: switching it on
  // both adds whole events and adds lines to events already on screen, and
  // counting events alone undercounts it badly (TAC-6225: 1 event, 5 changes).
  const countChanges = list => list.reduce((n, e) => n + (e.items ? e.items.length : 0), 0);
  const hiddenCount = Math.max(0, countChanges(buildTicketTimeline(issue, true)) - countChanges(events));

  scrim.innerHTML = `<div class="td-modal" role="dialog" aria-modal="true" aria-label="Ticket ${esc(key)}">
    ${head}
    <div class="td-body">
      ${detailFactsHtml(issue)}
      ${timeInStatusHtml(tis)}
      <div class="td-section-h">SLA clocks</div>
      ${slaCycleRows(issue)}
      <div class="td-section-h" style="margin-top:var(--space-5)">History
        <span style="font-weight:500;color:var(--fg-4)">${events.length} event${events.length !== 1 ? 's' : ''}</span>
        <label class="pc-checkbox">
          <input type="checkbox" ${detailShowAll ? 'checked' : ''} onchange="onDetailShowAllChange(this.checked)">
          <span>Show all changes${hiddenCount && !detailShowAll ? ` (+${hiddenCount} more)` : ''}</span>
        </label>
      </div>
      ${events.length
        ? `<div class="td-tl">${events.map((ev, i) => detailEventHtml(ev, events[i + 1])).join('')}</div>`
        : `<div class="empty-inline">No history recorded</div>`}
    </div>
  </div>`;

  const badges = document.getElementById('td-badges');
  if (badges) {
    badges.innerHTML = badge(s, sBg(s), sFg(s), null, true)
                     + badge(p, pc.bg, pc.fg)
                     + (f[TAC_TIER_FIELD]?.value ? badge('Tier ' + f[TAC_TIER_FIELD].value, 'var(--grey-100)', 'var(--fg-2)') : '');
  }
}

async function loadLive() {
  try {
    // Single logical pull of every open ticket (jiraSearch pages through the
    // connector's 100-per-call cap internally) — the Priority List tab sorts
    // this same in-memory array, so it never has to re-query Jira per tier.
    RAW_ISSUES = await jiraSearch(
      `project = TAC AND resolution = Unresolved AND ${TP_FILTER} ORDER BY updated DESC`,
      LIVE_FIELDS
    );
    recomputeViews();
    render(ALL_ISSUES);
    // Fetch today tickets for wallboard (sequential to avoid race condition)
    const base=`project = TAC AND ${TP_FILTER}`;
    const todayFields=['summary','status','priority','issuetype','assignee','created'];
    rawWbToday.created  = await jiraSearch(`${base} AND created  >= startOfDay() ORDER BY created  DESC`, todayFields);
    rawWbToday.resolved = await jiraSearch(`${base} AND resolved >= startOfDay() ORDER BY resolved DESC`, todayFields);
    recomputeViews();
    document.getElementById('ts').textContent='Updated '+new Date().toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
    renderWallboard();
  } catch(err) {
    document.getElementById('root').innerHTML=errorHtml(err.message);
    document.getElementById('priority-root').innerHTML=errorHtml(err.message);
  }
}

function render(issues) {

  const sc=tally(issues,i=>i.fields?.status?.name);

  const aged=issues.filter(i=>i.fields?.created&&(Date.now()-new Date(i.fields.created).getTime())>7*24*60*60*1000).length;

  const isSlaUrgent = i => { const s=resolveSla(i); return s?.type==='ticking' && s.millis < 3600000; };
  const attUrgent = issues.filter(i=>['New','Requester Responded'].includes(i.fields?.status?.name) && isSlaUrgent(i)).length;

      </div>
      <div class="tile" data-drill="hi" onclick="openDrill('hi')">
        <div class="tile-header">P3+ priority ${arrow}</div>
        <div class="tile-count">${hiP}</div>
        <div class="tile-sub">Moderate or higher</div>
      </div>
      <div class="tile" data-drill="aged" onclick="openDrill('aged')">
        <div class="tile-header">Open over 7 days ${arrow}</div>
        <div class="tile-count">${aged}</div>
        <div class="tile-sub">Created over a week ago</div>
      </div>
    </div>
    <div class="panel-row" id="panel-row-1">
      <div class="panel"><div class="panel-title">Queue by status</div><div class="chart-wrap" style="height:184px"><canvas id="statusChart"></canvas></div></div>
      <div class="panel"><div class="panel-title">Priority breakdown</div><div class="chart-wrap" style="height:184px"><canvas id="priChart"></canvas></div></div>

    </div>`;

  new Chart(document.getElementById('statusChart'),{

    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,

      scales:{x:{grid:GRID,border:{display:false},ticks:{...AXIS,precision:0}},y:{grid:{display:false},border:{display:false},ticks:{...AXIS,color:'#374151'}}}}

  new Chart(document.getElementById('priChart'),{
    type:'doughnut',

  new Chart(document.getElementById('typeChart'),{

      plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},border:{display:false},ticks:AXIS},y:{grid:GRID,border:{display:false},ticks:{...AXIS,precision:0}}}}
  });

  // Kept in sync with every live refresh, regardless of which tab is active —
  // it's a pure re-sort of the same ALL_ISSUES array, no extra Jira calls.
  renderPriorityList(issues);
}

function renderWallboard() {
  if (document.getElementById('view-wall').style.display === 'none') return;
  if (!ALL_ISSUES.length) {
    // RAW empty means the fetch hasn't landed yet — leave the spinner alone.
    // RAW populated but view empty means Personal mode filtered everything out,
    // and showing the previous unfiltered board would be a lie.
    if (RAW_ISSUES.length) {
      destroyWbCharts();
      const who = personalUser?.name || 'you';
      document.getElementById('wb-root').innerHTML =
        `<div class="loading-state"><span>No open tickets assigned to ${esc(who)}.</span></div>`;
    }
    return;
  }

  destroyWbCharts();

  const sc  = tally(ALL_ISSUES, i => i.fields?.status?.name);
  const ac  = tally(ALL_ISSUES, i => i.fields?.assignee?.displayName || 'Unassigned');
  const pc  = tally(ALL_ISSUES, i => i.fields?.priority?.name);

  const total    = ALL_ISSUES.length;
  const needs    = (sc['New']||0) + (sc['Requester Responded']||0);
  const inProg   = sc['In Progress'] || 0;
  const p3plus   = Object.entries(pc).filter(([k])=>/p[123]/i.test(k)).reduce((s,[,v])=>s+v,0);
  const pending  = sc['Pending Response'] || 0;

  const isSlaUrgent = i => { const s=resolveSla(i); return s?.type==='ticking'&&s.millis<3600000; };
  const needsWarn  = ALL_ISSUES.filter(i=>['New','Requester Responded'].includes(i.fields?.status?.name)&&isSlaUrgent(i)).length;
  const inProgWarn = ALL_ISSUES.filter(i=>i.fields?.status?.name==='In Progress'&&isSlaUrgent(i)).length;

  const kpisTop = [
    { label:'Total open',      value:total,                                  warn:0, drill:'total' },
    { label:'Created today',   value:wbTodayTickets.created?.length  ?? '—',  warn:0, drill:'createdToday' },
    { label:'Resolved today',  value:wbTodayTickets.resolved?.length ?? '—',  warn:0, drill:'resolvedToday', color:'var(--aa-green)' },
  ];
  const kpisBottom = [
    { label:'Needs action',     value:needs,   warn:needsWarn,  drill:'needs' },
    { label:'In progress',      value:inProg,  warn:inProgWarn, drill:'inProg' },
    { label:'P3+ priority',     value:p3plus,  warn:0,          drill:'p3' },
    { label:'Pending response', value:pending, warn:0,          drill:'pending' },
  ];

  const statusList = [...new Set([...STATUS_ORDER,...Object.keys(sc)])].filter(s=>sc[s]);
  const assignees  = Object.entries(ac).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const arOn = !!autoRefreshInterval;
  const arLabel = arOn ? (document.getElementById('ar-label')?.textContent || 'Auto-refresh on') : 'Auto-refresh off';
  document.getElementById('wb-root').innerHTML = `
    <div class="wb-head">
      <div class="wb-brand">
        <span class="wb-mark">${brandMark(30)}</span>
        <span class="wb-title">Access4 UK TAC</span>
        <span class="wb-badge">Live wallboard</span>
        ${(personalMode && personalUser) ? `<span class="wb-personal">${ico('user',12)}${esc(personalUser.name || 'Personal')} only</span>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="ar-btn${arOn?' is-on':''}" id="wb-ar-btn" onclick="toggleAutoRefresh()">
          <span class="ar-dot" id="wb-ar-dot"></span>
          <span id="wb-ar-label">${esc(arLabel)}</span>
        </button>
        <span class="wb-meta" id="wb-ts">—</span>
        <button class="icon-btn" style="width:30px;height:30px;border:1px solid var(--border-default);background:var(--bg-surface)" onclick="switchTab('live')" title="Exit wallboard">${ico('xmark',13)}</button>
      </div>
    </div>
    <div class="wb-kpis">
      <div class="wb-row wb-row-3">${kpisTop.map(wbTile).join('')}</div>
      <div class="wb-row wb-row-4">${kpisBottom.map(wbTile).join('')}</div>
    </div>
    <div class="wb-panels">
      <div class="wb-panel">
        <div class="wb-panel-title">Workload</div>
        <div id="wb-workload" style="display:flex;flex-direction:column;justify-content:space-evenly;flex:1;overflow:hidden"></div>
      </div>
      <div class="wb-panel">
        <div class="wb-panel-title">Tickets by status</div>
        <div class="wb-chart-wrap"><canvas id="wb-status"></canvas></div>
      </div>
    </div>`;

  document.getElementById('wb-ts').textContent =
    'Updated ' + new Date().toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});

  // Find assignees with urgent SLA tickets
  const urgentAssignees = new Set(
    ALL_ISSUES.filter(i => isSlaUrgent(i)).map(i => i.fields?.assignee?.displayName || 'Unassigned')
  );

  // Workload — flat brand bars, scaled for TV
  const maxA = assignees[0]?.[1] || 1;
  document.getElementById('wb-workload').innerHTML = assignees.map(([name, cnt], idx) => {
    const urgent = urgentAssignees.has(name);
    const avatarBg  = urgent ? '#B3261E' : avCol(idx);
    const nameColor = urgent ? 'var(--aa-red)' : 'var(--fg-2)';
    const barColor  = urgent ? '#D02D2D' : 'var(--sb-primary)';
    return `
    <div class="wb-arow${urgent ? ' wb-arow-urgent' : ''}" onclick="openWbAssigneeDrill('${esc(name.replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}')" style="display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(3px,.4vh,6px) clamp(4px,.5vw,8px)">
      <div class="av" style="width:clamp(30px,3.2vw,48px);height:clamp(30px,3.2vw,48px);font-size:clamp(11px,1.3vw,18px);background:${avatarBg}">${esc(initials(name))}</div>
      <div style="font-size:clamp(13px,1.35vw,21px);font-weight:${urgent?600:500};color:${nameColor};width:clamp(100px,14vw,200px);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
      <div style="flex:1;height:clamp(8px,.9vh,14px);background:var(--grey-200);border-radius:var(--radius-xs);overflow:hidden">
        <div style="height:100%;width:${Math.round(cnt/maxA*100)}%;background:${barColor};border-radius:var(--radius-xs)"></div>
      </div>
      <div style="font-size:clamp(15px,1.75vw,27px);font-weight:600;color:${nameColor};width:clamp(24px,2.5vw,40px);text-align:right;flex:none;font-variant-numeric:tabular-nums">${cnt}</div>
    </div>`;
  }).join('');

  // Status chart
  wbChartInstances.status = new Chart(document.getElementById('wb-status'), {
    type: 'bar',
    data: {
      labels: statusList,
      datasets: [{ data: statusList.map(s=>sc[s]), backgroundColor: statusList.map(s=>sCol(s)), borderRadius:4, borderSkipped:false }]
    },
    options: {
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      // Click a status bar to open the same overlay the KPI tiles use
      onClick:(evt,els)=>{ if (els.length) openWbStatusDrill(statusList[els[0].index]); },
      onHover:(evt,els)=>{ const c=evt.native?.target; if(c) c.style.cursor = els.length?'pointer':'default'; },
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${ctx.parsed.x} ticket${ctx.parsed.x!==1?'s':''}`}} },
      scales:{
        x:{ grid:{color:'#E5E7EB',drawTicks:false}, border:{display:false},
            ticks:{color:'#6B7280',font:{family:"'Poppins',sans-serif",size:15,weight:500},precision:0} },
        y:{ grid:{display:false}, border:{display:false},
            ticks:{color:'#374151',font:{family:"'Poppins',sans-serif",size:15,weight:600}} }
      }
    }
  });
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
let autoRefreshInterval = null;
let autoRefreshCountdown = null;
let nextRefreshAt = null;
const REFRESH_MS = 5 * 60 * 1000; // 5 minutes

function toggleAutoRefresh() {
  if (autoRefreshInterval) {
    stopAutoRefresh();
  } else {
    startAutoRefresh();
  }
}

function setArBtnState(on, label) {
  [['ar-btn','ar-label'],['wb-ar-btn','wb-ar-label']].forEach(([bId,lId]) => {
    const btn=document.getElementById(bId), lbl=document.getElementById(lId);
    if (!btn) return;
    btn.classList.toggle('is-on', on);
    if (lbl) lbl.textContent = label;
  });
}

function startAutoRefresh() {
  nextRefreshAt = Date.now() + REFRESH_MS;
  autoRefreshInterval = setInterval(() => { loadLive(); nextRefreshAt = Date.now() + REFRESH_MS; }, REFRESH_MS);
  autoRefreshCountdown = setInterval(() => {
    const secsLeft = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
    const m = Math.floor(secsLeft / 60), s = secsLeft % 60;
    setArBtnState(true, `Refreshing in ${m}:${String(s).padStart(2,'0')}`);
  }, 1000);
  setArBtnState(true, 'Refreshing in 5:00');
}

function stopAutoRefresh() {
  clearInterval(autoRefreshInterval);
  clearInterval(autoRefreshCountdown);
  autoRefreshInterval = null;
  autoRefreshCountdown = null;
  nextRefreshAt = null;
  setArBtnState(false, 'Auto-refresh off');
}

paintChrome();
document.addEventListener('click', closeTacTierPanelOnOutsideClick);
document.addEventListener('click', closeClosedPanelsOnOutsideClick);
document.addEventListener('click', onTicketRowClick);
document.addEventListener('keydown', onDetailKeydown);
// Identity resolves BEFORE the first fetch, because JIRA_BASE (every ticket's
// browse link) comes out of the same /api/me call. One extra round-trip up
// front, against a loadLive() that already makes several paginated calls —
// cheap next to rendering a whole table of links pointing at the wrong site.
// It is memoised, so the Personal mode restore below reuses it rather than
// re-fetching. A failure here is non-fatal: JIRA_BASE keeps its fallback and
// togglePersonalMode reports the problem in its own error state.
loadIdentity()
  .catch(() => {})
  .then(() => {
    loadLive();
    if (personalPrefLoad()) { togglePersonalMode(true); }
  });
</script>
