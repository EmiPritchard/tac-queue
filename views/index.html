:root{
  color-scheme: light;

  /* ── Brand / base ─────────────────────────────────────────── */
  --sb-primary:#008EAA; --sb-secondary:#244C5A; --sb-green:#3CB24C;
  --sb-lightblue:#2DCCD3; --sb-red:#E36159; --sb-error-red:#D02D2D;
  --sb-yellow:#FFCE32; --sb-yellow-text:#8B6420;
  --sb-primary-text:#328F95;

  /* ── Greys ────────────────────────────────────────────────── */
  --white:#FFFFFF; --grey-50:#F9FAFB; --grey-100:#F3F4F6; --grey-200:#E5E7EB;
  --grey-300:#D1D5DB; --grey-400:#9CA3AF; --grey-500:#6B7280; --grey-600:#4B5563;
  --grey-700:#374151; --grey-800:#1F2937; --grey-900:#111827;

  /* ── Tints ────────────────────────────────────────────────── */
  --primary-90:#31A3BA; --primary-50:#BFE2E9; --primary-40:#D6EDF1;
  --primary-30:#E8F5F8; --primary-20:#F5FAFC;
  --secondary-40:#DCE2E5; --secondary-30:#EBEFF0;
  --green-40:#E0F3E2; --green-30:#EEF8EF;
  --lb-50:#CAF2F4; --lb-40:#DDF7F8; --lb-30:#ECFBFB;
  --red-30:#F7D0CE; --red-20:#F9DFDE; --red-10:#FDF0EF;
  --yellow-30:#FFF1C2; --yellow-20:#FFF5D6; --yellow-10:#FFFBEB;

  /* ── Accessibility ───────────────────────────────────────── */
  --aa-primary:#00738A; --aa-green:#297A34; --aa-red:#B3261E;
  --disabled-bg:#EDEEF1;

  /* ── Semantic ────────────────────────────────────────────── */
  --fg-1:var(--grey-900); --fg-2:var(--grey-700); --fg-3:var(--grey-500); --fg-4:var(--grey-400);
  --bg-app:var(--grey-50); --bg-surface:var(--white); --bg-highlight:var(--primary-30);
  --border-default:var(--grey-200); --border-strong:var(--grey-300);

  /* ── Radii · spacing · motion ────────────────────────────── */
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-pill:9999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px;
  --motion-fast:.12s ease; --motion-base:.15s ease;

  /* ── Shadows (production tile only) ──────────────────────── */
  --shadow-tile:1px 1px 4px #00000029;
  --shadow-md:0 4px 12px rgba(17,24,39,.08);

  --font-sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-sans); font-size:14px; line-height:20px;
  font-weight:400; color:var(--fg-2); background:var(--bg-app);
  padding:var(--space-5) var(--space-6); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.ico{display:inline-block;vertical-align:-.125em;flex:none}

/* ═══ Header ══════════════════════════════════════════════════════════════ */
.hdr{display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-5)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:26px;height:26px;flex:none;color:var(--sb-lightblue)}
.brand-name{font-size:18px;line-height:28px;font-weight:600;color:var(--sb-secondary)}
.badge-view{
  background:var(--primary-30);color:var(--aa-primary);
  font-size:13px;line-height:18px;font-weight:500;
  padding:3px 10px;border-radius:var(--radius-pill);
}
.hdr-meta{display:flex;align-items:center;gap:var(--space-3)}
.ts{font-size:13px;line-height:18px;color:var(--fg-3);font-variant-numeric:tabular-nums}

/* Auto-refresh control */
.ar-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;
  font-family:inherit;font-size:14px;line-height:16px;font-weight:600;
  color:var(--fg-2);transition:background-color var(--motion-base),border-color var(--motion-base),color var(--motion-base);
}
.ar-btn:hover{background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.ar-btn.is-on{background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.ar-dot{width:7px;height:7px;border-radius:50%;background:var(--grey-300);flex:none}
.ar-btn.is-on .ar-dot{background:var(--sb-primary)}
@keyframes a4-breathe{0%,100%{opacity:1}50%{opacity:.35}}
.ar-btn.is-on .ar-dot{animation:a4-breathe 2s ease-in-out infinite}

/* Tabs — production .tab-style3 */
.tabs{display:flex;align-items:flex-end;gap:0;border-bottom:1px solid var(--border-default)}
.tab{
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;font-size:14px;line-height:20px;font-weight:600;
  color:#9F9F9F;background:none;border:0;border-bottom:2px solid transparent;
  padding:8px 2px 7px;margin:0 24px 0 0;cursor:pointer;white-space:nowrap;
  transition:color var(--motion-fast),border-color var(--motion-fast);
}
.tab:hover{color:var(--fg-2)}
.tab.is-active{color:var(--sb-primary);border-bottom-color:var(--sb-primary)}

/* ═══ States ══════════════════════════════════════════════════════════════ */
.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:var(--space-4);color:var(--fg-3);font-size:14px;
}
.spinner{
  width:28px;height:28px;border:2px solid var(--grey-200);
  border-top-color:var(--sb-primary);border-radius:50%;
  animation:a4-spin .8s linear infinite;
}
@keyframes a4-spin{to{transform:rotate(360deg)}}
.error-box{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--red-10);border:1px solid var(--red-30);
  border-radius:var(--radius-md);padding:var(--space-4);
  color:var(--aa-red);font-size:14px;line-height:20px;
}
.error-box .ico{margin-top:2px;color:var(--sb-error-red)}

/* ═══ Tiles (production .panel.tile) ═════════════════════════════════════ */
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--space-3);margin-bottom:var(--space-5)}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-5)}
@media (max-width:720px){.tile-grid{grid-template-columns:1fr 1fr}}

.tile{
  background:var(--bg-surface);box-shadow:var(--shadow-tile);
  border-radius:var(--radius-xs);padding:14px 16px;
  display:flex;flex-direction:column;gap:6px;
  cursor:pointer;user-select:none;position:relative;
  transition:background-color var(--motion-base),box-shadow var(--motion-base);
}
.tile:hover{background:var(--grey-50)}
.tile.is-active{background:var(--primary-20);box-shadow:var(--shadow-tile),inset 0 0 0 1px var(--sb-primary)}
.tile-header{
  font-size:14px;line-height:20px;font-weight:600;color:var(--sb-primary-text);
  display:flex;align-items:center;gap:6px;
}
.tile-count{
  font-size:32px;line-height:40px;font-weight:600;color:var(--grey-700);
  font-variant-numeric:tabular-nums;
}
.tile-count.sz-sm{font-size:20px;line-height:28px}
.tile-count.sz-xs{font-size:15px;line-height:22px;font-weight:600}
.tile-sub{font-size:12px;line-height:16px;color:var(--fg-4)}
.tile-note{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600}
.tile-note.ok{color:var(--aa-green)}
.tile-note.bad{color:var(--aa-red)}
.tile-flag{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--red-20);color:var(--aa-red);
  font-size:12px;line-height:16px;font-weight:600;
  padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;
}
.tile-countline{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

/* ═══ Week nav ════════════════════════════════════════════════════════════ */
.week-nav{display:flex;align-items:center;justify-content:center;gap:var(--space-4);margin-bottom:var(--space-5)}
.nav-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;
  font-family:inherit;font-size:14px;line-height:16px;font-weight:600;color:var(--fg-2);
  transition:background-color var(--motion-base),border-color var(--motion-base),color var(--motion-base);
}
.nav-btn:hover:not(:disabled){background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.nav-btn:disabled{background:var(--disabled-bg);border-color:var(--border-default);color:var(--fg-4);cursor:not-allowed}
.week-label{
  font-size:16px;line-height:24px;font-weight:600;color:var(--sb-secondary);
  min-width:220px;text-align:center;font-variant-numeric:tabular-nums;
}

/* ═══ Panels ══════════════════════════════════════════════════════════════ */
.panel-row{display:grid;grid-template-columns:3fr 2fr;gap:var(--space-3);margin-bottom:var(--space-3)}
@media (max-width:720px){.panel-row{grid-template-columns:1fr}}
.panel{
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-md);padding:var(--space-4) var(--space-4);
}
.panel-title{
  font-size:14px;line-height:20px;font-weight:600;color:var(--sb-secondary);
  margin-bottom:var(--space-4);display:flex;align-items:center;gap:8px;
}
.chart-wrap{position:relative}

/* ═══ Drill panel ════════════════════════════════════════════════════════ */
.drill{
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-md);margin-bottom:var(--space-5);overflow:hidden;
}
.drill-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-default);
  background:var(--grey-50);
}
.drill-title{
  font-size:14px;line-height:20px;font-weight:600;color:var(--sb-secondary);
  display:flex;align-items:center;gap:var(--space-2);
}
.drill-count{
  font-size:13px;line-height:18px;font-weight:500;
  background:var(--grey-200);color:var(--grey-700);
  padding:1px 8px;border-radius:var(--radius-pill);
  font-variant-numeric:tabular-nums;
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;color:var(--fg-3);
  width:26px;height:26px;border-radius:var(--radius-xs);
  transition:background-color var(--motion-fast),color var(--motion-fast);
}
.icon-btn:hover{background:var(--grey-200);color:var(--fg-2)}
.link-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--primary-20);border:1px solid var(--primary-50);color:var(--aa-primary);
  font:inherit;font-size:12px;line-height:16px;font-weight:600;
  padding:2px 8px;margin-left:8px;border-radius:var(--radius-pill);white-space:nowrap;
  cursor:pointer;vertical-align:middle;transition:background-color var(--motion-fast);
}
.link-btn:hover{background:var(--primary-30)}
.link-btn.is-active{background:var(--primary-30);border-color:var(--sb-primary)}
.link-btn .link-count{font-variant-numeric:tabular-nums}
.ready-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--green-30);border:1px solid var(--aa-green);color:var(--aa-green);
  font-size:12px;line-height:16px;font-weight:600;
  padding:2px 8px;margin-left:8px;border-radius:var(--radius-pill);white-space:nowrap;
}
.scroll-x{overflow-x:auto}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.tbl th{
  text-align:left;padding:9px 14px;white-space:nowrap;
  font-size:13px;line-height:18px;font-weight:600;color:var(--grey-700);
  background:var(--grey-50);border-bottom:1px solid var(--border-default);
}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-default);vertical-align:middle;color:var(--fg-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--grey-50)}
.t-key{color:var(--sb-primary);font-weight:600;text-decoration:none;white-space:nowrap}
.t-key:hover{text-decoration:underline}
.t-sum{max-width:320px;color:var(--fg-2)}
.t-sm{white-space:nowrap;color:var(--fg-2);font-size:13px}

/* ═══ Priority List ═══════════════════════════════════════════════════════ */
.priority-summary{font-size:13px;line-height:18px;color:var(--fg-3)}
.priority-controls{
  display:flex;align-items:center;gap:var(--space-3);
  flex-wrap:wrap;margin-bottom:var(--space-4);
}
.pc-label{font-size:13px;line-height:18px;font-weight:600;color:var(--fg-2)}
/* A native <select>'s arrow is drawn by the browser/OS, not CSS — it can't be
   restyled to match our own chevron-down SVG (used on the TAC Tier button)
   without appearance:none plus a manually positioned replacement, which is
   what the wrapper + overlaid icon below does. Without this the two controls
   share every other style (border, radius, padding, hover color) yet still
   read as visually different because of that one glyph. */
.pc-select-wrap{position:relative;display:inline-flex}
.pc-select-wrap .ico{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--fg-2);
  transition:color var(--motion-base);
}
.pc-select-wrap:hover .ico{color:var(--aa-primary)}
.pc-select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  font-family:inherit;font-size:14px;line-height:16px;font-weight:500;
  color:var(--fg-2);background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:7px 34px 7px 12px;cursor:pointer;min-width:230px;
  transition:border-color var(--motion-base),color var(--motion-base);
}
.pc-select:hover{border-color:var(--sb-primary);color:var(--aa-primary)}
.pc-select:focus-visible{outline:2px solid var(--sb-primary);outline-offset:1px}
.pc-checkbox{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:13px;line-height:18px;font-weight:500;color:var(--fg-2);
}
.pc-checkbox input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--sb-primary)}
.tt-multiselect{position:relative;display:inline-block}
.tt-ms-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;font-size:14px;line-height:16px;font-weight:500;
  color:var(--fg-2);background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:7px 12px;cursor:pointer;
  transition:border-color var(--motion-base),color var(--motion-base);
}
.tt-ms-btn:hover{border-color:var(--sb-primary);color:var(--aa-primary)}
.tt-ms-btn .ico{transition:transform var(--motion-fast);flex:none}
.tt-ms-btn.is-open .ico{transform:rotate(180deg)}
.tt-ms-panel{
  position:absolute;top:calc(100% + 4px);left:0;z-index:20;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(17,24,39,.12);
  padding:6px;min-width:110px;
}
.tt-ms-option{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-xs);
  cursor:pointer;font-size:13px;line-height:18px;color:var(--fg-2);white-space:nowrap;
}
.tt-ms-option:hover{background:var(--grey-100)}
.tt-ms-option input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--sb-primary)}


/* ═══ Closed list ═════════════════════════════════════════════════════════ */
/* A breached row is tinted rather than badged-only, so a scan down the list
   finds the misses without reading every SLA cell. Both rules have to repeat
   the tint on hover, because `.tbl tbody tr:hover td` would otherwise win on
   specificity and flip a red row grey exactly when the pointer is on it. */
.tbl tbody tr.row-breach td{background:var(--red-10)}
.tbl tbody tr.row-breach:hover td{background:var(--red-20)}
/* The SLA picker lists six names, the longest being "First Response Time" —
   too wide for the TAC Tier panel's 110px, hence its own width. */
.tt-ms-panel.is-wide{min-width:210px}
.cl-pager{
  display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;
  padding:var(--space-4) 0 0;
}
.cl-pager-note{font-size:13px;line-height:18px;color:var(--fg-3)}
.cl-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-family:inherit;font-size:13px;line-height:18px;font-weight:600;
  color:var(--aa-primary);background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:7px 12px;cursor:pointer;
  transition:border-color var(--motion-base),background-color var(--motion-base);
}
.cl-btn:hover:not(:disabled){border-color:var(--sb-primary);background:var(--primary-20)}
.cl-btn:disabled{color:var(--fg-4);cursor:default;background:var(--disabled-bg)}
.cl-btn .ico{flex:none}


/* ═══ Ticket detail overlay ═══════════════════════════════════════════════ */
/* Rows in every ticket table become clickable. The key inside stays a link to
   Jira, so the row handler ignores clicks that land on an <a> or <button>. */
.tbl tbody tr[data-ticket]{cursor:pointer}
.td-scrim{
  position:fixed;inset:0;z-index:100;
  background:rgba(17,24,39,.45);
  display:flex;align-items:flex-start;justify-content:center;
  padding:var(--space-5);overflow-y:auto;
}
.td-modal{
  background:var(--bg-surface);border-radius:var(--radius-md);
  box-shadow:0 12px 40px rgba(17,24,39,.24);
  width:100%;max-width:920px;margin:auto;
  display:flex;flex-direction:column;
}
.td-head{
  display:flex;align-items:flex-start;gap:var(--space-4);
  padding:var(--space-5);border-bottom:1px solid var(--border-default);
}
.td-head-main{flex:1;min-width:0}
.td-key{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;line-height:18px;font-weight:600;
  color:var(--sb-primary);text-decoration:none;
}
.td-key:hover{text-decoration:underline}
.td-title{font-size:18px;line-height:26px;font-weight:600;color:var(--fg-1);margin-top:4px}
.td-badges{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.td-body{padding:var(--space-5);overflow-y:auto}

/* Facts grid — the current state, above the history */
.td-facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--space-3) var(--space-4);
  padding-bottom:var(--space-5);margin-bottom:var(--space-5);
  border-bottom:1px solid var(--border-default);
}
.td-fact-k{font-size:11px;line-height:16px;font-weight:600;color:var(--fg-4);text-transform:uppercase;letter-spacing:.04em}
.td-fact-v{font-size:13px;line-height:18px;color:var(--fg-2);margin-top:2px;word-break:break-word}

.td-section-h{
  display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;
  font-size:13px;line-height:18px;font-weight:600;color:var(--fg-1);
  margin-bottom:var(--space-4);
}
.td-section-h .pc-checkbox{margin-left:auto;font-weight:500}

/* Time in status — a horizontal proportional bar */
.td-tis{margin-bottom:var(--space-5)}
.td-tis-bar{display:flex;height:10px;border-radius:var(--radius-pill);overflow:hidden;background:var(--grey-100)}
.td-tis-seg{height:100%}
.td-tis-seg + .td-tis-seg{box-shadow:inset 1px 0 0 rgba(255,255,255,.65)}
.td-tis-legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-3)}
.td-tis-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--fg-3)}
.td-tis-dot{width:9px;height:9px;border-radius:50%;flex:none}
.td-tis-item b{color:var(--fg-2);font-weight:600;font-variant-numeric:tabular-nums}

/* Timeline — a rail down the left with a marker per event */
.td-tl{position:relative;padding-left:var(--space-5)}
.td-tl::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;
  width:2px;background:var(--grey-200);
}
.td-ev{position:relative;padding-bottom:var(--space-5)}
.td-ev:last-child{padding-bottom:0}
.td-ev-dot{
  position:absolute;left:calc(-1 * var(--space-5) + 1px);top:4px;
  width:10px;height:10px;border-radius:50%;
  background:var(--grey-400);box-shadow:0 0 0 3px var(--bg-surface);
}
.td-ev.is-breach   .td-ev-dot{background:var(--sb-error-red)}
.td-ev.is-sla      .td-ev-dot{background:var(--sb-primary)}
.td-ev.is-owner    .td-ev-dot{background:var(--sb-lightblue)}
.td-ev.is-created  .td-ev-dot{background:var(--sb-green)}
.td-ev.is-resolved .td-ev-dot{background:var(--sb-green)}
.td-ev-when{font-size:12px;line-height:16px;color:var(--fg-4);font-variant-numeric:tabular-nums}
.td-ev-who{
  display:inline-flex;align-items:center;gap:5px;
  font-size:13px;line-height:18px;font-weight:600;color:var(--fg-2);
}
.td-ev-bot{
  font-size:10px;line-height:14px;font-weight:600;letter-spacing:.03em;
  color:var(--fg-3);background:var(--grey-100);border:1px solid var(--border-default);
  border-radius:var(--radius-xs);padding:0 4px;text-transform:uppercase;
}
.td-ev-gap{font-size:11px;line-height:16px;color:var(--fg-4);font-style:italic}
.td-ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:13px;line-height:20px}
.td-ch-f{color:var(--fg-3)}
.td-ch-v{
  background:var(--grey-100);border-radius:var(--radius-xs);
  padding:1px 6px;color:var(--fg-2);
}
.td-ch-v.is-none{color:var(--fg-4);font-style:italic}
.td-ch-arrow{color:var(--fg-4);flex:none}
.td-sla-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:5px;font-size:13px;line-height:20px}
.td-sla-meta{color:var(--fg-3);font-variant-numeric:tabular-nums}

/* ═══ Closed list KPI strip ═══════════════════════════════════════════════ */
/* Its own grid class rather than reusing .tile-row, because renderDrill()
   locates the live tab's drill panel with document.querySelector('.tile-row')
   — a second .tile-row earlier in the document would send that panel into the
   wrong tab. */
.cl-kpis{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--space-3);margin-bottom:var(--space-5);
}
/* These tiles are read-only. Plain .tile carries cursor:pointer and a hover
   wash for the Historical tab's drillable ones, and both would promise a
   click that does nothing here. */
.tile.is-static{cursor:default;user-select:auto}
.tile.is-static:hover{background:var(--bg-surface)}

/* ═══ Personal mode ═══════════════════════════════════════════════════════ */
.pm-toggle{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;
  font-family:inherit;font-size:14px;line-height:16px;font-weight:600;
  color:var(--fg-2);user-select:none;white-space:nowrap;
  transition:background-color var(--motion-base),border-color var(--motion-base),color var(--motion-base);
}
.pm-toggle:hover{background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.pm-toggle.is-on{background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.pm-toggle.is-error{background:var(--red-10);border-color:var(--red-30);color:var(--aa-red)}
.pm-toggle input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--sb-primary);flex:none}
.pm-toggle:focus-within{outline:2px solid var(--sb-primary);outline-offset:1px}
.pm-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary-30);color:var(--aa-primary);
  font-size:13px;line-height:18px;font-weight:600;
  padding:4px 11px;border-radius:var(--radius-pill);white-space:nowrap;
}
.pm-note{
  display:flex;align-items:flex-start;gap:8px;
  background:var(--primary-20);border:1px solid var(--primary-50);
  border-radius:var(--radius-md);padding:10px var(--space-4);
  color:var(--fg-2);font-size:13px;line-height:18px;margin-bottom:var(--space-4);
}
.pm-note .ico{margin-top:2px;color:var(--sb-primary);flex:none}
.wb-personal{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary-30);color:var(--aa-primary);
  font-size:clamp(11px,1.1vw,15px);font-weight:600;
  padding:3px 12px;border-radius:var(--radius-pill);white-space:nowrap;
}
.tier-row td{
  background:var(--grey-50);border-bottom:1px solid var(--border-default);
  padding:7px 14px;font-size:12px;line-height:16px;font-weight:600;
  color:var(--sb-secondary);text-transform:uppercase;letter-spacing:.03em;
}
.tier-row .drill-count{margin-left:8px;text-transform:none;letter-spacing:normal}
.t-num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.sort-ind{color:var(--sb-primary);margin-left:2px}
.status-swatch{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.empty{padding:var(--space-6);text-align:center;color:var(--fg-4);font-size:14px}
.empty-inline{padding:var(--space-5);text-align:center;color:var(--fg-4);font-size:13px}

/* Badges — design system .badge light-emphasis */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:var(--radius-xs);
  font-size:13px;line-height:18px;font-weight:500;white-space:nowrap;
}
.badge-pill{border-radius:var(--radius-pill);padding:2px 10px}
.badge .ico{flex:none}

/* SLA section split */
.sla-block{padding:var(--space-3) 0}
.sla-block + .sla-block{border-top:1px solid var(--border-default)}
.sla-block-title{
  font-size:13px;line-height:18px;font-weight:600;
  padding:0 var(--space-4) var(--space-2);
  display:flex;align-items:center;gap:6px;
}

/* Breakdown rows */
.brow{
  display:flex;align-items:center;gap:var(--space-3);
  padding:8px var(--space-4);border-bottom:1px solid var(--border-default);
  transition:background-color var(--motion-fast);
}
.brow:last-child{border-bottom:0}
.brow.clickable{cursor:pointer}
.brow.clickable:hover{background:var(--grey-50)}
.brow.clickable.is-active{background:var(--primary-30)}
.bname{font-size:13px;line-height:18px;width:220px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--grey-200);border-radius:var(--radius-xs);overflow:hidden}
.bar-fill{height:100%;background:var(--sb-primary);border-radius:var(--radius-xs)}
.bcount{font-size:13px;line-height:18px;font-weight:600;color:var(--fg-2);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.bchev{width:14px;text-align:center;flex:none;color:var(--fg-4);display:inline-flex;align-items:center;justify-content:center}

/* Sub drill */
.sub-drill{border-top:1px solid var(--border-default);background:var(--grey-50)}
.sub-drill-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px var(--space-4);
}
.sub-drill-title{font-size:13px;line-height:18px;font-weight:600;color:var(--aa-primary);display:flex;align-items:center;gap:6px}

/* Assignee rows */
.arow{
  display:flex;align-items:center;gap:10px;
  padding:7px 6px;margin:0 -6px;border-bottom:1px solid var(--border-default);
  border-radius:var(--radius-xs);transition:background-color var(--motion-fast);
}
.arow:last-child{border-bottom:0}
.arow.clickable{cursor:pointer;user-select:none}
.arow.clickable:hover{background:var(--grey-50)}
.arow.clickable.is-active{background:var(--primary-30)}
.av{
  width:30px;height:30px;border-radius:50%;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1;font-weight:600;color:#fff;
}
.aname{font-size:13px;line-height:18px;width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acount{font-size:13px;line-height:18px;font-weight:600;color:var(--fg-2);width:26px;text-align:right;font-variant-numeric:tabular-nums}

/* Type chips */
.chip-row{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--grey-100);color:var(--grey-700);
  border-radius:var(--radius-xs);padding:4px 10px;
  font-size:13px;line-height:18px;
}
.chip strong{font-weight:600;font-variant-numeric:tabular-nums}
.chip-dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ═══════════════════════════════════════════════════════════════════════════
   WALLBOARD — same tokens, clamp()-scaled for TV
   ═══════════════════════════════════════════════════════════════════════════ */
.wallboard{
  height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:var(--bg-app);color:var(--fg-2);
  padding:clamp(10px,1.5vh,20px) clamp(14px,2vw,32px);
  gap:clamp(8px,1.2vh,16px);
}
.wb-head{display:flex;align-items:center;justify-content:space-between;flex:none;gap:var(--space-4)}
.wb-brand{display:flex;align-items:center;gap:clamp(8px,.9vw,14px)}
.wb-mark{width:clamp(22px,2vw,34px);height:clamp(22px,2vw,34px);flex:none;color:var(--sb-lightblue)}
.wb-title{font-size:clamp(16px,1.9vw,28px);line-height:1.2;font-weight:600;color:var(--sb-secondary)}
.wb-badge{
  background:var(--primary-30);color:var(--aa-primary);
  font-size:clamp(10px,.95vw,14px);line-height:1.4;font-weight:600;
  padding:3px 10px;border-radius:var(--radius-pill);white-space:nowrap;
}
.wb-meta{font-size:clamp(11px,1vw,15px);color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}

.wb-kpis{display:flex;flex-direction:column;gap:clamp(6px,.8vh,12px);flex:none}
.wb-row{display:grid;gap:clamp(8px,1vw,16px)}
.wb-row-3{grid-template-columns:repeat(3,1fr)}
.wb-row-4{grid-template-columns:repeat(4,1fr)}
.wb-tile{
  background:var(--bg-surface);box-shadow:var(--shadow-tile);
  border-radius:var(--radius-xs);
  padding:clamp(10px,1.8vh,20px) clamp(8px,1.4vw,18px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:clamp(3px,.5vh,7px);cursor:pointer;
  transition:background-color var(--motion-base);
}
.wb-tile:hover{background:var(--grey-50)}
.wb-tile-label{
  font-size:clamp(11px,1.05vw,17px);line-height:1.3;font-weight:600;
  color:var(--sb-primary-text);white-space:nowrap;
}
.wb-tile-count{
  font-size:clamp(44px,6.4vw,100px);line-height:1;font-weight:600;
  color:var(--grey-700);font-variant-numeric:tabular-nums;
}
.wb-warn-wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.3vh,5px);flex:none}
.wb-warn-label{
  display:inline-flex;align-items:center;gap:4px;
  font-size:clamp(9px,.78vw,13px);line-height:1.2;font-weight:600;
  color:var(--aa-red);white-space:nowrap;
}
.wb-warn{
  display:flex;align-items:center;justify-content:center;flex:none;
  width:clamp(24px,2.5vw,38px);height:clamp(24px,2.5vw,38px);
  border-radius:50%;background:var(--sb-error-red);color:#fff;
  font-weight:600;font-size:clamp(12px,1.35vw,19px);font-variant-numeric:tabular-nums;
}
/* Urgent — border + tint wash, no elevation change */
@keyframes a4-urgent{
  0%,100%{background:var(--bg-surface);box-shadow:var(--shadow-tile),inset 0 0 0 1px transparent}
  50%    {background:var(--red-10);   box-shadow:var(--shadow-tile),inset 0 0 0 2px var(--sb-error-red)}
}
.wb-tile.is-urgent{animation:a4-urgent 1.8s ease-in-out infinite}
@keyframes a4-urgent-row{0%,100%{background:transparent}50%{background:var(--red-10)}}
.wb-arow-urgent{animation:a4-urgent-row 1.8s ease-in-out infinite;border-radius:var(--radius-xs)}
/* Workload rows are drillable — cursor + wash only, no added chrome */
.wb-arow{cursor:pointer;border-radius:var(--radius-xs);transition:background-color var(--motion-fast)}
.wb-arow:hover{background:var(--grey-50)}

.wb-panels{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,16px);flex:1;min-height:0}
.wb-panel{
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  padding:clamp(10px,1.8vh,18px) clamp(10px,1.4vw,18px);
  display:flex;flex-direction:column;min-height:0;
}
.wb-panel-title{
  font-size:clamp(12px,1.2vw,18px);line-height:1.3;font-weight:600;
  color:var(--sb-secondary);margin-bottom:clamp(8px,1vh,14px);flex:none;
}
.wb-chart-wrap{flex:1;position:relative;min-height:0}

/* Wallboard overlay */
.wb-overlay{
  position:absolute;inset:0;z-index:200;background:var(--bg-app);
  display:flex;flex-direction:column;
  padding:clamp(14px,1.8vw,30px);gap:clamp(10px,1.2vh,18px);
}
.wb-ov-head{display:flex;align-items:center;justify-content:space-between;flex:none;gap:var(--space-4)}
.wb-ov-title{font-size:clamp(17px,2vw,30px);line-height:1.2;font-weight:600;color:var(--sb-secondary)}
.wb-ov-count{font-size:clamp(13px,1.2vw,19px);color:var(--fg-3);font-weight:500;font-variant-numeric:tabular-nums}
.wb-ov-close{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;
  font-size:clamp(13px,1.2vw,18px);line-height:1;font-weight:600;color:var(--fg-2);
  padding:clamp(7px,.8vw,12px) clamp(11px,1.1vw,18px);
  transition:background-color var(--motion-base),border-color var(--motion-base),color var(--motion-base);
}
.wb-ov-close:hover{background:var(--primary-30);border-color:var(--sb-primary);color:var(--aa-primary)}
.wb-ov-scroll{
  flex:1;overflow-y:auto;background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--radius-md);
}
.wb-tbl{width:100%;border-collapse:collapse;font-size:clamp(13px,1.2vw,19px)}
.wb-tbl th{
  text-align:left;position:sticky;top:0;z-index:1;
  padding:clamp(8px,.9vh,13px) clamp(10px,1vw,16px);
  font-size:clamp(11px,.95vw,15px);line-height:1.3;font-weight:600;
  color:var(--grey-700);background:var(--grey-50);
  border-bottom:1px solid var(--border-default);white-space:nowrap;
}
.wb-tbl td{
  padding:clamp(8px,.9vh,13px) clamp(10px,1vw,16px);
  border-bottom:1px solid var(--border-default);vertical-align:middle;
}
.wb-tbl tbody tr:last-child td{border-bottom:0}
.wb-tbl tbody tr:hover td{background:var(--grey-50)}

</head>

// ── Constants ─────────────────────────────────────────────────────────────────
const CLOUD     = '';  // resolved server-side from the signed-in user's Atlassian site
// Browse-link base. Resolved at boot from /api/me, which reports the Atlassian

// already (it pointed at a leftover sandbox site and every key link 404'd).
// FALLBACK_SITE only applies if /api/me fails, in which case there is no ticket
// data to link to either.
const FALLBACK_SITE = 'https://access4.atlassian.net';

// ── Data layer ───────────────────────────────────────────────────────────────
// Calls go to this app's own server, which holds the Atlassian OAuth token and
// forwards a narrow read-only slice of the Jira API. The browser never sees a
// credential. Everything below this line is unchanged from the original
// dashboard: it only ever needed "give me issues for this JQL".

function httpError(status, text) {
  const e = new Error(text || ('HTTP ' + status));
  if (status === 401) e.code = 'needs_reauth';
  else if (status === 403) e.code = 'blocked_by_policy';
  // A 404 carrying no JSON body never reached a route handler: every route in
  // server.js answers errors as JSON. In practice that means the running
  // server predates the front-end asking for the route — views/index.html is
  // re-read from disk per request, server.js is not. A real Jira 404 (issue
  // deleted or invisible to this account) arrives as JSON, so it keeps the
  // upstream_error path below and shows Jira's own message.
  else if (status === 404 && !text) e.code = 'route_missing';
  else if (status >= 500) { e.code = 'server_unavailable'; e.retryable = true; }
  else e.code = 'upstream_error';
  return e;
}

function mcpErrorMessage(err) {
  switch (err && err.code) {
    case 'needs_reauth':       return 'Your session has expired. Reload the page to sign in again.';
    case 'blocked_by_policy':  return 'Your Jira account does not have permission to read this queue.';
    case 'route_missing':      return 'That API route does not exist on the server. If the dashboard was updated recently, restart the server process — the page reloads from disk on every request, but server.js does not.';
    case 'server_unavailable': return 'Jira is temporarily unreachable. Retrying shortly.';
    case 'upstream_error':     return (err.message || 'Could not reach Jira.');
    default:                   return (err && err.message) || 'Could not reach Jira.';
  }
}

async function apiFetch(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.message || j.error || ''; } catch (e) {}
    throw httpError(res.status, detail);
  }
  return res.json();
}

// Kept in the shape the renderers already expect ({payload}), so parseJira and
// readPayload work untouched.
async function callSearchTool(params) {
  const body = {
    jql: params.jql,
    fields: params.fields,
    maxResults: params.maxResults || 100,
  };
  if (params.nextPageToken) body.nextPageToken = params.nextPageToken;
  const doCall = () => apiFetch('/api/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  try {
    return { payload: await doCall() };
  } catch (err) {
    if (err && err.retryable) {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      return { payload: await doCall() };
    }
    throw err;
  }
}

async function callMcpTool(tool, params) {
  if (tool === MCP_USERINFO) return { payload: await apiFetch('/api/me') };
  return callSearchTool(params);
}

// Generic payload reader for tools that answer with a plain JSON object.
function readPayload(result) {
  if (result && typeof result === 'object') {
    if (result.payload && typeof result.payload === 'object') return result.payload;
    if (typeof result.payload === 'string') return JSON.parse(result.payload);
    if (Array.isArray(result.content)) {
      const b = result.content.find(b => b?.type === 'text' && b.text);
      if (b) return JSON.parse(b.text);
    }
  }
  throw new Error('Unexpected response from the connector.');
}

function formatDuration(ms) {

  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  if (h>=48) return `${Math.floor(h/24)}d ${h%24>0?h%24+'h':''}`.trim();
  if (h>=24) return `${Math.floor(h/24)}d ${h%24}h`;
  if (h>0)   return `${h}h ${m}m`;
  if (m>0)   return `${m}m`;
  return '< 1m';
}
function formatBreachTime(epochMillis) {
  const now=new Date(), breach=new Date(epochMillis), tz='Europe/London';
  const ds=d=>d.toLocaleDateString('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'});
  const time=breach.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false});
  if (ds(now)===ds(breach)) return time;
  const day=breach.toLocaleDateString('en-GB',{timeZone:tz,day:'numeric'});
  const mon=breach.toLocaleDateString('en-GB',{timeZone:tz,month:'short'});
  return `${day} ${mon} ${time}`;
}
function fmtShortDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtShortDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso), tz = 'Europe/London';
  const date = d.toLocaleDateString('en-GB', {timeZone:tz, day:'numeric', month:'short', year:'numeric'});
  const time = d.toLocaleTimeString('en-GB', {timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false});
  return `${date} ${time}`;
}
// Use Jira's own startOfWeek() to avoid timezone drift between browser and server
function getJqlWeekFilter(field, offset) {
  const sw = n => n === 0 ? 'startOfWeek()' : `startOfWeek(${n})`;
  if (offset >= 0) return `${field} >= ${sw(offset)}`;
  return `${field} >= ${sw(offset)} AND ${field} < ${sw(offset + 1)}`;
}

// ── Parse Jira response ───────────────────────────────────────────────────────
// `result` is a Claude.mcp.CallToolResult from the mcp capability. `.payload`
// carries the JSON answer (structuredContent when present, else the first
// text block parsed as JSON) — this is the shape actually observed from
// searchJiraIssuesUsingJql: { issues: { nodes: [...], pageInfo: {...} } }.
function parseJira(result) {
  function safeParse(text) {
    try { return JSON.parse(text); }
    catch(e) { throw new Error(text.slice(0,300)); }
  }
  if (result && typeof result === 'object') {
    if (result.payload && typeof result.payload === 'object') return result.payload;
    if (typeof result.payload === 'string') return safeParse(result.payload);
    if (Array.isArray(result.content)) {
      const b = result.content.find(b => b?.type === 'text' && b.text);
      if (b) return safeParse(b.text);
    }
  }
  throw new Error('Unexpected response from the Jira search tool.');
}

// Pull the issue list back out of either the current GraphQL-style shape
// (issues.nodes) or a flat issues array, in case the connector's response
// shape varies.
function jiraIssueNodes(r) {
  if (Array.isArray(r?.issues)) return r.issues;
  if (Array.isArray(r?.issues?.nodes)) return r.issues.nodes;
  return [];
}
function jiraNextCursor(r) {
  const pi = r?.issues?.pageInfo;
  if (pi && pi.hasNextPage && pi.endCursor) return pi.endCursor;
  // REST shape (/rest/api/3/search/jql, what /api/search proxies). Per the
  // published schema NOTHING in that response is a required field, so `isLast`
  // may simply be absent — the documented end-of-results signal is
  // `nextPageToken` coming back null. Keying off `isLast === false` (as this
  // did) therefore stops after page one whenever Jira omits the flag, silently
  // truncating the queue. Page on the token; only treat `isLast === true` as an
  // explicit stop. Note pages are usually well under maxResults here: Jira
  // shrinks them when many fields are requested, and LIVE_FIELDS asks for 13.
  if (r?.nextPageToken && r.isLast !== true) return r.nextPageToken;
  return null;
}

// ── Jira search with pagination ───────────────────────────────────────────────
async function jiraSearch(jql, fields) {
  let all=[], cursor=undefined;
  do {
    const params={cloudId:CLOUD,jql,fields,maxResults:100,responseContentFormat:'markdown'};
    if (cursor) params.nextPageToken=cursor;
    let result;
    try { result = await callSearchTool(params); }
    catch(err) { throw new Error(mcpErrorMessage(err)); }
    const r=parseJira(result);
    all=all.concat(jiraIssueNodes(r));
    cursor=jiraNextCursor(r);
  } while(cursor);
  return all;
}

// ── SLA helpers (live queue) ──────────────────────────────────────────────────
// Returns background / foreground tint pair plus the icon that carries the meaning.
function slaStyle(type, millis) {
  if (type==='breached')  return {bg:'#F9DFDE',fg:'#B3261E',icon:'circle-exclamation'};
  if (type==='paused')    return {bg:'#F3F4F6',fg:'#4B5563',icon:'circle-minus'};
  if (type==='completed') return {bg:'#EEF8EF',fg:'#297A34',icon:'circle-check'};
  if (millis<3600000)     return {bg:'#F9DFDE',fg:'#B3261E',icon:'clock'};
  if (millis<4*3600000)   return {bg:'#FFF1C2',fg:'#8B6420',icon:'clock'};
  if (millis<24*3600000)  return {bg:'#E8F5F8',fg:'#00738A',icon:'clock'};
  return {bg:'#EEF8EF',fg:'#297A34',icon:'clock'};
}
// "Breached" means breaching RIGHT NOW: an SLA cycle still open and already
// past its target. A cycle that breached and has since COMPLETED is history —
// somebody responded and the clock stopped — so it must not keep the ticket
// flagged. That distinction is the whole rule; see CLAUDE.md section 4.
//
// The breach check runs BEFORE the ticking check, and that ordering is the
// point. A ticket routinely has one clock blown and another still healthy —
// "Time with Agent" has a 100h goal and stays green long after First Response
// or Resolution have gone — and the blown clock is the fact that matters. The
// previous version only reported 'breached' when NO clock was still running,
// so a single healthy SLA hid live breaches on 15 of 56 open tickets.
//
// A PAUSED cycle never counts as breaching, even if it is past target: paused
// means the requirement is not currently outstanding — the clock is stopped
// pending the other party, so there is nothing actionable to chase right now.
// (Decided 28 Aug 2026, superseding an earlier version that counted
// paused-and-past-target as breached; that covered 7 of the 26 tickets in the
// tier and misrepresented them as active breaches.)
function isBreachingNow(s) { return !!(s && s.ongoingCycle && s.ongoingCycle.breached && !s.ongoingCycle.paused); }

function resolveSla(issue) {
  const slas=SLA_ALL.map(f=>issue.fields?.[f]).filter(Boolean);
  if (!slas.length) return null;
  const breaching=slas.filter(isBreachingNow);
  if (breaching.length) return {type:'breached',label:'Breached',millis:-1};
  // Anything still open past this point is un-breached, so 'ticking' is just
  // the running clocks and 'paused' the stopped ones.
  const ticking=slas.filter(s=>s.ongoingCycle&&!s.ongoingCycle.paused);
  if (ticking.length) {
    const soonest=ticking.reduce((m,s)=>s.ongoingCycle.remainingTime.millis<m.ongoingCycle.remainingTime.millis?s:m);
    const ms=soonest.ongoingCycle.remainingTime.millis;
    const epoch=soonest.ongoingCycle.breachTime?.epochMillis;
    return {type:'ticking',label:epoch?formatBreachTime(epoch):'—',millis:ms,slaName:soonest.name};
  }
  if (slas.some(s=>s.ongoingCycle&&s.ongoingCycle.paused)) return {type:'paused',label:'Paused',millis:Infinity};
  // Every cycle has finished. Some may have breached on the way, but that is
  // past tense and deliberately not surfaced as a live breach.
  if (slas.every(s=>!s.ongoingCycle)) return {type:'completed',label:'Completed',millis:Infinity};
  return null;
}
// ── SLA sort ──────────────────────────────────────────────────────────────────
// Most urgent first: already breached, then ticking (soonest breach at the top),
// then paused, then completed, then tickets carrying no SLA data at all.
const SLA_RANK = { breached:0, ticking:1, paused:2, completed:3 };
const SLA_RANK_NONE = 4;
function slaSortKey(issue) {
  const s = resolveSla(issue);
  if (!s) return [SLA_RANK_NONE, 0];
  const rank = SLA_RANK[s.type] ?? SLA_RANK_NONE;
  // remaining-time only discriminates within the ticking group; everything else
  // is flattened to 0 so a paused SLA can never outrank a breached one.
  return [rank, s.type === 'ticking' ? s.millis : 0];
}
function sortBySla(tickets) {
  return tickets
    .map((t, i) => ({ t, i, k: slaSortKey(t) }))   // resolve once per ticket, not per comparison
    .sort((a, b) => a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.i - b.i)  // i keeps it stable
    .map(x => x.t);
}

function slaCell(issue, iconSize) {
  const sla = resolveSla(issue);
  if (!sla) return `<span style="color:var(--grey-300)">—</span>`;
  const st = slaStyle(sla.type, sla.millis);
  const title = sla.slaName ? ` title="${esc(sla.slaName)}"` : '';
  return `<span class="badge badge-pill"${title} style="background:${st.bg};color:${st.fg}">`
       + ico(st.icon, iconSize || 12) + esc(sla.label) + `</span>`;
}

// ── SLA helpers (historical) ──────────────────────────────────────────────────
function getSlaHistStatus(issue) {
  const breachedSlas=[];
  let hasData=false;
  for (const [f,name] of Object.entries(SLA_TRACKED)) {
    const sla=issue.fields?.[f];
    if (!sla) continue;
    hasData=true;
    if (sla.completedCycles?.some(c=>c.breached)||sla.ongoingCycle?.breached) breachedSlas.push(name);
  }
  return {met:breachedSlas.length===0,breachedSlas,hasData};
}
function getFrt(issue) { const s=issue.fields?.customfield_10967; if(!s?.completedCycles?.length) return null; return s.completedCycles[s.completedCycles.length-1].elapsedTime?.millis??null; }
function getResTime(issue) { const s=issue.fields?.customfield_10969; if(!s?.completedCycles?.length) return null; return s.completedCycles[s.completedCycles.length-1].elapsedTime?.millis??null; }
function getCsat(issue) { const c=issue.fields?.customfield_10690; if(!c) return null; return typeof c.rating==='number'?c.rating:null; }

function getWeekBounds(offset) {

  const start=new Date(mon); start.setDate(mon.getDate()+offset*7);
  const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
  return {start,end};
}
function formatWeekLabel(s,e) {

  return sm===em?`${sd} – ${ed} ${em} ${yr}`:`${sd} ${sm} – ${ed} ${em} ${yr}`;
}

// ── Breakdown sub-drill (shared by Top organisation and Top product) ─────────
let activeSubDrill = {};

function openSubDrill(rowEl, drillType, name) {
  const subId = drillType + '-sub-drill';
  const breakdownId = drillType + '-breakdown';
  const sub = document.getElementById(subId);
  if (!sub) return;

  // Deactivate all rows in this breakdown
  document.querySelectorAll(`#${breakdownId} .brow`).forEach(r => {
    r.classList.remove('is-active');
    const ch = r.querySelector('.bchev');
    if (ch) ch.innerHTML = ico('chevron-right',11);
  });

  // Toggle off if same item clicked again
  if (activeSubDrill[drillType] === name) {
    activeSubDrill[drillType] = null;
    sub.innerHTML = '';
    return;
  }
  activeSubDrill[drillType] = name;
  rowEl.classList.add('is-active');
  const ch = rowEl.querySelector('.bchev');
  if (ch) ch.innerHTML = ico('chevron-down',11);

  const tickets = drillType === 'product'
    ? histCreated.filter(i => (i.fields?.customfield_10854?.value || 'Not set') === name)
    : histCreated.filter(i => ((i.fields?.customfield_10002 || [])[0]?.name || 'Unknown') === name);

  const rows = tickets.map(i => {
    const s = i.fields?.status?.name || '—';
    const p = i.fields?.priority?.name || '—', pc = priColor(p);
    return `<tr data-ticket="${esc(i.key)}">
      <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
      <td class="t-sum">${esc(i.fields?.summary || '—')}</td>
      <td>${badge(s, sBg(s), sFg(s), null, true)}</td>
      <td>${badge(p, pc.bg, pc.fg)}</td>
      <td class="t-sm">${esc(i.fields?.assignee?.displayName || 'Unassigned')}</td>
      <td class="t-sm">${fmtShortDateTime(i.fields?.created)}</td>
    </tr>`;
  }).join('');

  const jsName = name.replace(/\\/g,'\\\\').replace(/'/g, "\\'");
  sub.innerHTML = `
    <div class="sub-drill">
      <div class="sub-drill-head">
        <div class="sub-drill-title">${ico(drillType==='product'?'box':'building',12)}${esc(name)} — ${tickets.length} ticket${tickets.length!==1?'s':''}</div>
        <button class="icon-btn" title="Close" onclick="openSubDrill(document.querySelector('#${breakdownId} [data-item=\\'${esc(jsName)}\\']'),'${drillType}','${jsName}')">${ico('xmark',13)}</button>
      </div>
      <div class="scroll-x">
        <table class="tbl">
          <thead><tr><th>Key</th><th>Summary</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Created</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty-inline">No tickets</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Historical drill-downs ────────────────────────────────────────────────────
function openHistDrill(type) {
  document.querySelectorAll('[data-hdrill]').forEach(c=>c.classList.remove('is-active'));
  if (activeHistDrill===type) { closeHistDrill(); return; }
  document.querySelector(`[data-hdrill="${type}"]`)?.classList.add('is-active');
  activeHistDrill=type;
  renderHistDrill(type);
}
function closeHistDrill() {
  document.querySelectorAll('[data-hdrill]').forEach(c=>c.classList.remove('is-active'));
  activeHistDrill=null;
  activeSubDrill={};
  document.getElementById('hist-drill')?.remove();
}

function renderHistDrill(type) {
  document.getElementById('hist-drill')?.remove();
  const panel=document.createElement('div');
  panel.id='hist-drill'; panel.className='drill';

  let title='', body='', count=0;

  if (type==='created'||type==='resolved') {
    const tickets=type==='created'?histCreated:histResolved;
    title=type==='created'?'Tickets created':'Tickets resolved';

    const isCreated=type==='created';
    const dLabel=isCreated?'Created':'Resolved';
    const rows=tickets.map(i=>{
      const p=i.fields?.priority?.name||'—', pc=priColor(p);

      return `<tr data-ticket="${esc(i.key)}">
        <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
        <td class="t-sum">${esc(i.fields?.summary||'—')}</td>
        <td>${badge(s, sBg(s), sFg(s), null, true)}</td>
        <td>${badge(p, pc.bg, pc.fg)}</td>
        <td class="t-sm">${esc(i.fields?.assignee?.displayName||'Unassigned')}</td>
        <td class="t-sm">${esc(org)}</td>
        <td class="t-sm">${esc(prod)}</td>
        <td class="t-sm">${isCreated?fmtShortDateTime(i.fields?.created):fmtShortDate(i.fields?.resolutiondate)}</td>
      </tr>`;
    }).join('');
    body=`<div class="scroll-x"><table class="tbl">
      <thead><tr><th>Key</th><th>Summary</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Organisation</th><th>Product</th><th>${dLabel}</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" class="empty">No tickets</td></tr>'}</tbody>
    </table></div>`;
  }

  else if (type==='frt'||type==='avgRes') {
    const isFrt=type==='frt';
    title=isFrt?'First response times':'Resolution times';
    const getT=isFrt?getFrt:getResTime;
    const tickets=histResolved.filter(i=>getT(i)!=null).sort((a,b)=>(getT(b)||0)-(getT(a)||0));
    count=tickets.length;
    const rows=tickets.map(i=>{
      const t=getT(i), p=i.fields?.priority?.name||'—', pc=priColor(p);
      const tc=isFrt
        ?(t>14400000?'var(--aa-red)':t>7200000?'var(--sb-yellow-text)':'var(--aa-green)')
        :(t>86400000?'var(--aa-red)':t>28800000?'var(--sb-yellow-text)':'var(--aa-green)');
      return `<tr data-ticket="${esc(i.key)}">
        <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
        <td class="t-sum">${esc(i.fields?.summary||'—')}</td>
        <td class="t-sm">${esc(i.fields?.assignee?.displayName||'Unassigned')}</td>
        <td>${badge(p, pc.bg, pc.fg)}</td>
        <td class="t-num" style="color:${tc}">${formatDuration(t)}</td>
      </tr>`;
    }).join('');
    body=`<div class="scroll-x"><table class="tbl">
      <thead><tr><th>Key</th><th>Summary</th><th>Assignee</th><th>Priority</th><th>${isFrt?'Response time':'Resolution time'}</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="empty">No data</td></tr>'}</tbody>
    </table></div>`;
  }

  else if (type==='topOrg'||type==='topProduct') {
    const isOrg=type==='topOrg';
    title=isOrg?'Tickets by organisation':'Tickets by product';
    const counts=isOrg
      ?tally(histCreated,i=>(i.fields?.customfield_10002||[])[0]?.name||'Unknown')
      :tally(histCreated,i=>i.fields?.customfield_10854?.value||'Not set');
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    count=sorted.length;
    const maxV=sorted[0]?.[1]||1;
    const dtype = isOrg ? 'org' : 'product';
    const rows=sorted.map(([n,c])=>{
      const jsN = n.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="brow clickable" onclick="openSubDrill(this,'${dtype}','${jsN}')" data-item="${esc(n)}">

        <div class="bcount">${c}</div>
        <div class="bchev">${ico('chevron-right',11)}</div>
      </div>`;
    }).join('');
    body=`<div id="${dtype}-breakdown">${rows||'<div class="empty">No data</div>'}</div>
          <div id="${dtype}-sub-drill"></div>`;
  }

  else if (type==='slaMet') {
    title='SLA performance';
    const withData=histResolved.filter(i=>getSlaHistStatus(i).hasData);
    const met=withData.filter(i=>getSlaHistStatus(i).met);
    const failed=withData.filter(i=>!getSlaHistStatus(i).met);
    count=withData.length;
    const mkRows=(arr,showBreach)=>arr.map(i=>{
      const info=getSlaHistStatus(i);
      return `<tr data-ticket="${esc(i.key)}">
        <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
        <td class="t-sum">${esc(i.fields?.summary||'—')}</td>
        <td class="t-sm">${esc(i.fields?.assignee?.displayName||'Unassigned')}</td>
        ${showBreach?`<td>${info.breachedSlas.map(n=>badge(n,'#F9DFDE','#B3261E')).join(' ')}</td>`:''}
      </tr>`;
    }).join('');
    body=`
      <div class="sla-block">
        <div class="sla-block-title" style="color:var(--aa-green)">${ico('circle-check',12)}Met all SLAs (${met.length})</div>
        <div class="scroll-x"><table class="tbl">
          <thead><tr><th>Key</th><th>Summary</th><th>Assignee</th></tr></thead>
          <tbody>${mkRows(met,false)||'<tr><td colspan="3" class="empty-inline">None</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="sla-block">
        <div class="sla-block-title" style="color:var(--aa-red)">${ico('circle-exclamation',12)}Missed SLA (${failed.length})</div>
        <div class="scroll-x"><table class="tbl">
          <thead><tr><th>Key</th><th>Summary</th><th>Assignee</th><th>Breached SLAs</th></tr></thead>
          <tbody>${mkRows(failed,true)||'<tr><td colspan="4" class="empty-inline">None</td></tr>'}</tbody>
        </table></div>
      </div>`;
  }

  else if (type==='slaBreaches') {
    title='SLA breaches';
    const tickets=histResolved.filter(i=>getSlaHistStatus(i).breachedSlas.length>0);
    count=tickets.length;
    const rows=tickets.map(i=>{
      const info=getSlaHistStatus(i), p=i.fields?.priority?.name||'—', pc=priColor(p);
      const severity=i.fields?.customfield_10700?.value||'—';
      const product=i.fields?.customfield_10854?.value||'—';
      return `<tr data-ticket="${esc(i.key)}">
        <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
        <td class="t-sum">${esc(i.fields?.summary||'—')}</td>
        <td>${badge(p, pc.bg, pc.fg)}</td>
        <td class="t-sm">${esc(severity)}</td>
        <td class="t-sm">${esc(product)}</td>
        <td class="t-sm">${esc(i.fields?.assignee?.displayName||'Unassigned')}</td>
        <td>${info.breachedSlas.map(n=>badge(n,'#F9DFDE','#B3261E')).join(' ')}</td>
      </tr>`;
    }).join('');
    body=`<div class="scroll-x"><table class="tbl">
      <thead><tr><th>Key</th><th>Summary</th><th>Priority</th><th>Severity</th><th>Product type</th><th>Assignee</th><th>Breached SLAs</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="empty">No breaches this week</td></tr>'}</tbody>
    </table></div>`;
  }

  else if (type==='csat') {
    title='CSAT ratings';
    const tickets=histResolved.filter(i=>getCsat(i)!=null).sort((a,b)=>getCsat(a)-getCsat(b));
    count=tickets.length;
    const rows=tickets.map(i=>{
      const r=getCsat(i);
      const st = r>=4 ? {bg:'#EEF8EF',fg:'#297A34'} : r>=3 ? {bg:'#FFF1C2',fg:'#8B6420'} : {bg:'#F9DFDE',fg:'#B3261E'};
      return `<tr data-ticket="${esc(i.key)}">
        <td><a class="t-key" href="${JIRA_BASE}/${i.key}" target="_blank" rel="noopener">${esc(i.key)}</a></td>
        <td class="t-sum">${esc(i.fields?.summary||'—')}</td>
        <td class="t-sm">${esc(i.fields?.assignee?.displayName||'Unassigned')}</td>
        <td>${badge(r + ' of 5', st.bg, st.fg, null, true)}</td>

    }).join('');
    body=`<div class="scroll-x"><table class="tbl">
      <thead><tr><th>Key</th><th>Summary</th><th>Assignee</th><th>Rating</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="4" class="empty">No CSAT data this week</td></tr>'}</tbody>
    </table></div>`;
  }

  panel.innerHTML=`
    <div class="drill-head">

  document.getElementById('kpi-grid').insertAdjacentElement('afterend',panel);
}

// ═══════════════════════════════════════════════════════════════════════════
// ── Personal mode ─────────────────────────────────────────────────────────────
// Narrows every view to the tickets assigned to whoever is looking at the page.
//
// Identity comes from the Atlassian connector: MCP calls run with the VIEWER'S
// own credentials, so atlassianUserInfo returns them, not whoever published
// this artifact. That is the Jira/Atlassian identity — the claude.ai account
// email is not exposed to the page — which is the right key anyway, since the
// point is to match Jira's assignee field.
//
// This is a focus tool, NOT an access control. The unfiltered queue is still
// fetched and still sits in memory; Jira's own permissions decide what any
// given viewer is allowed to read. The banner in the UI says so.
// ═══════════════════════════════════════════════════════════════════════════
let personalMode  = false;
let personalUser  = null;    // { accountId, email, name }
let personalState = 'off';   // off | loading | on | error
let personalError = '';

// Raw fetches stay pristine; the view arrays the renderers read are derived.
let RAW_ISSUES = [];
let rawHistCreated = [], rawHistResolved = [];
let rawWbToday = { created: null, resolved: null };

function matchesViewer(issue) {
  const a = issue.fields?.assignee;
  if (!a || !personalUser) return false;
  // accountId first: it survives display-name changes and the privacy setting
  // that hides emailAddress from the API. Email and name are fallbacks only.
  if (a.accountId && personalUser.accountId) return a.accountId === personalUser.accountId;
  if (a.emailAddress && personalUser.email) return a.emailAddress.toLowerCase() === personalUser.email.toLowerCase();
  return !!(a.displayName && personalUser.name && a.displayName === personalUser.name);
}
function personalFilter(list) {
  if (!Array.isArray(list)) return list;
  return (personalMode && personalUser) ? list.filter(matchesViewer) : list;
}
// Recompute what the renderers read. Cheap: pure array filtering, no fetches.
function recomputeViews() {
  ALL_ISSUES   = personalFilter(RAW_ISSUES);
  histCreated  = personalFilter(rawHistCreated);
  histResolved = personalFilter(rawHistResolved);
  wbTodayTickets = {
    created:  rawWbToday.created  ? personalFilter(rawWbToday.created)  : rawWbToday.created,
    resolved: rawWbToday.resolved ? personalFilter(rawWbToday.resolved) : rawWbToday.resolved,
  };
}
function applyPersonalView() {
  recomputeViews();
  paintPersonalBtn();
  if (RAW_ISSUES.length) render(ALL_ISSUES);
  if (histEverLoaded) renderHistorical();
  if (closedEverLoaded) renderClosed();
  renderWallboard();
}

function personalPrefSave(on) { try { localStorage.setItem('a4tac_personal', on ? '1' : '0'); } catch (e) {} }
function personalPrefLoad()   { try { return localStorage.getItem('a4tac_personal') === '1'; } catch (e) { return false; } }

function paintPersonalBtn() {
  const wrap = document.getElementById('pm-toggle');
  const lbl  = document.getElementById('pm-label');
  const box  = document.getElementById('pm-check');
  if (!wrap || !lbl) return;
  wrap.classList.toggle('is-on', personalState === 'on');
  wrap.classList.toggle('is-error', personalState === 'error');
  if (box) box.checked = personalMode;
  if (personalState === 'loading') { lbl.textContent = 'Identifying you\u2026'; wrap.title = ''; return; }
  if (personalState === 'error')   { lbl.textContent = 'Personal mode unavailable'; wrap.title = personalError; return; }
  if (personalState === 'on') {
    const who = personalUser?.name || personalUser?.email || 'you';
    lbl.textContent = 'Personal mode \u00b7 ' + who;
    wrap.title = 'Showing only tickets assigned to ' + who + '.';
    return;
  }
  lbl.textContent = 'Personal mode';
  wrap.title = 'Filter every view to tickets assigned to you';
}

function personalBanner() {
  if (!(personalMode && personalUser)) return '';
  const who = personalUser.name || personalUser.email || 'you';
  return `<div class="pm-note">${ico('user',13)}<span>Filtered to tickets assigned to <strong>${esc(who)}</strong>.</span></div>`;
}

// One /api/me call answers two questions: who is looking (Personal mode) and
// which Atlassian site their token reaches (JIRA_BASE, for browse links).
// Called once at boot and memoised, so toggling Personal mode is instant and
// the ticket links are already correct on the very first render.
let identityPromise = null;
async function loadIdentity() {
  if (identityPromise) return identityPromise;
  identityPromise = (async () => {
    const info = readPayload(await callMcpTool(MCP_USERINFO, {}));
    if (!info || (!info.account_id && !info.email)) throw new Error('Jira did not return an identity for you.');
    if (info.siteUrl) JIRA_BASE = String(info.siteUrl).replace(/\/+$/, '') + '/browse';
    personalUser = { accountId: info.account_id || '', email: info.email || '', name: info.name || '' };
    return personalUser;
  })();
  // A failed lookup must not be cached as a permanent "no": the usual cause is
  // an expired session, and the next attempt happens after a re-auth.
  identityPromise.catch(() => { identityPromise = null; });
  return identityPromise;
}

async function togglePersonalMode(on) {
  if (!on) {
    personalMode = false; personalState = 'off'; personalError = '';
    personalPrefSave(false);
    applyPersonalView();
    return;
  }
  personalMode = true;
  personalPrefSave(true);
  priorityAssignee = '';           // the manual picker is redundant once scoped to you
  closedAssignee = '';             // ditto on the Closed list
  if (personalUser) { personalState = 'on'; applyPersonalView(); return; }

  personalState = 'loading'; personalError = ''; paintPersonalBtn();
  try {
    await loadIdentity();
    personalState = 'on';
  } catch (err) {
    personalMode = false;
    personalState = 'error';
    personalError = err && err.code ? mcpErrorMessage(err) : (err?.message || 'Could not identify you.');
    personalUser = null;
  }
  applyPersonalView();
}

// ═══════════════════════════════════════════════════════════════════════════
// ── Priority List ─────────────────────────────────────────────────────────────
// A single flat queue ordering built entirely client-side from the already-
// fetched ALL_ISSUES (no per-tier Jira calls). Every open ticket is assigned
// to exactly the FIRST tier below it qualifies for (a waterfall, top to
// bottom), then each tier is sorted by its own rule.
// ═══════════════════════════════════════════════════════════════════════════
const PRIORITY_TIERS = [
  { label:'P1 / P2' },
  { label:'SLA breached' },
  { label:'Due within 1 hour' },
  { label:'To triage — New' },
  { label:'To respond — Requester responded' },
  { label:'Due today' },
  { label:'P3, no update in 24h+' },
  { label:'P4, no update in 72h+' },
  { label:'P5, no update in 7 days+' },
  { label:'In progress' },
  { label:'Everything else' },
];

// Statuses meaning "parked on someone outside the TAC team", held out of the
// P1/P2 tier and the three stale-priority tiers. 'Scheduled With Partner'
// joined 'Pending Response' here on 4 Sep 2026: it was found in TAC-6225's
// changelog, had no colour or tier treatment at all, and by the business's
// reading is the same kind of wait.
//
// NOT the same as the Awaiting Internal/External Party statuses: those are
// handled by the Priority list's hide-toggle and by tier ordering, not by
// being excluded from tiers.
const PARKED_STATUSES = new Set(['Pending Response', 'Scheduled With Partner']);

function priorityRank(name) {
  const m = /p(\d)/i.exec(name || '');
  return m ? parseInt(m[1], 10) : 99;
}
function hoursSinceUpdate(issue) {
  const u = issue.fields?.updated;
  return u ? (Date.now() - new Date(u).getTime()) / 3600000 : 0;
}
// Sort key for "closest to go overdue at the top": remaining ms on the
// ticket's active ticking SLA (from the same resolveSla() the rest of the
// dashboard uses), pushed to the bottom of its tier when there's no ticking
// SLA to count down.
function overdueSortKey(issue) {
  const sla = resolveSla(issue);
  if (sla && sla.type === 'ticking') return sla.millis;
  if (sla && sla.type === 'breached') return -Infinity;
  return Infinity;
}
// "Been in breach the longest" for tier 2's sort: the earliest target the
// ticket is CURRENTLY past. Only open cycles count — completed ones are
// breaches that have since been answered, and letting them in here would sort
// a ticket by an old resolved miss instead of the one still running.
function currentBreachEpoch(issue) {
  let earliest = Infinity;
  for (const f of SLA_ALL) {
    const s = issue.fields?.[f];
    if (!isBreachingNow(s)) continue;
    const e = s.ongoingCycle.breachTime?.epochMillis;
    if (e != null) earliest = Math.min(earliest, e);
  }
  return earliest;
}
function londonDateStr(d) { return d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' }); }
// True when a ticking SLA's breach falls on today's London calendar date.
function breachesTodayLondon(sla) {
  const approxBreach = new Date(Date.now() + sla.millis);
  return londonDateStr(approxBreach) === londonDateStr(new Date());
}

function buildPriorityList(issues) {
  let pool = issues.slice();
  // Parked: the next action belongs to someone outside the TAC team, so the
  // ticket must not be pulled up as an urgent P1/P2 or flagged as stale. It
  // still appears in the list, just via a later tier.
  const notParked = i => !PARKED_STATUSES.has(i.fields?.status?.name);
  const byOverdue = (a, b) => overdueSortKey(a) - overdueSortKey(b);

  function take(predicate, cmp) {
    const matched = [];
    pool = pool.filter(issue => {
      if (predicate(issue)) { matched.push(issue); return false; }
      return true;
    });
    matched.sort(cmp);
    return matched;
  }

  const groups = [
    // 1. P1/P2 (excluding parked statuses) — P1 above P2, then oldest created first.
    take(
      i => notParked(i) && /p[12]/i.test(i.fields?.priority?.name || ''),
      (a, b) => priorityRank(a.fields?.priority?.name) - priorityRank(b.fields?.priority?.name)
             || new Date(a.fields?.created) - new Date(b.fields?.created)
    ),
    // 2. Currently in breach — longest-breached first. "Currently" is the whole
    //    rule: a ticket that missed a target but has since been answered drops
    //    out of this tier (see resolveSla).
    take(i => resolveSla(i)?.type === 'breached', (a, b) => currentBreachEpoch(a) - currentBreachEpoch(b)),
    // 3. Ticking, breaching within the next hour (paused SLAs are a different type, excluded automatically).
    take(i => { const s = resolveSla(i); return s?.type === 'ticking' && s.millis < 3600000; }, byOverdue),
    // 4. To triage — status New.
    take(i => i.fields?.status?.name === 'New', byOverdue),
    // 5. To respond — status Requester Responded.
    take(i => i.fields?.status?.name === 'Requester Responded', byOverdue),
    // 6. Ticking, breaching later today (paused excluded automatically; <1h already claimed above).
    take(i => { const s = resolveSla(i); return s?.type === 'ticking' && breachesTodayLondon(s); }, byOverdue),
    // 7. P3, stale 24h+ (excluding parked statuses).
    take(i => notParked(i) && /p3/i.test(i.fields?.priority?.name || '') && hoursSinceUpdate(i) > 24, byOverdue),
    // 8. P4, stale 72h+ (excluding parked statuses).
    take(i => notParked(i) && /p4/i.test(i.fields?.priority?.name || '') && hoursSinceUpdate(i) > 72, byOverdue),
    // 9. P5, stale 7 days+ (excluding parked statuses).
    take(i => notParked(i) && /p5/i.test(i.fields?.priority?.name || '') && hoursSinceUpdate(i) > 168, byOverdue),
    // 10. In Progress.
    take(i => i.fields?.status?.name === 'In Progress', byOverdue),
    // 11. Everything left.
    take(() => true, byOverdue),
  ];
  return PRIORITY_TIERS.map((t, idx) => ({ ...t, items: groups[idx] }));
}

const PRIORITY_THEAD = '<thead><tr><th>#</th><th>Key</th><th>Summary</th><th>Status</th>'
                      + '<th>Priority</th><th>Assignee</th><th>SLA</th><th>Updated</th></tr></thead>';
const PRIORITY_COLS = 8; // keep in sync with PRIORITY_THEAD — used for the link-drill row's colspan

// Which linked-tickets rows are currently expanded in the Priority list, keyed
// by issue key. Re-read on every renderPriorityTable() call (the table is
// fully rebuilt on refresh/filter-change, same pattern as activeSubDrill).
let expandedLinkDrills = new Set();
function toggleLinkDrill(key) {
  if (expandedLinkDrills.has(key)) expandedLinkDrills.delete(key);
  else expandedLinkDrills.add(key);
  renderPriorityTable(ALL_ISSUES); // renderPriorityTable re-applies priorityAssignee itself
}

// Awaiting Internal Team means the ticket is blocked on someone else's work,
// usually tracked as a Jira issue link (e.g. an Incident this ticket "is
// caused by"). The linked-issue stub Jira returns always carries summary,
// status and priority regardless of what LIVE_FIELDS asked for — including
// for issues in other projects (ESD, DEVX, ...) — so no per-row fetch is
// needed; it's already sitting in RAW_ISSUES from the one live-queue pull.
function otherIssueOf(link) { return link.outwardIssue || link.inwardIssue || null; }
// statusCategory.key, not the status name: linked issues can live in any
// project, each with its own workflow and its own words for "finished"
// (Closed, Resolved, Done, Won't Fix, ...). statusCategory is Jira's own
// project-independent signal for that and every issue stub carries it.
function isLinkDone(link) { const o = otherIssueOf(link); return !!(o && o.fields?.status?.statusCategory?.key === 'done'); }
// "Ready to close": every linked ticket is finished, so whatever this ticket
// was Awaiting Internal Team FOR has landed and it's worth a human re-checking
// whether the ticket itself can now be resolved too. A ticket with zero links
// is never "ready" by this rule — there's nothing to confirm against.
function allLinksResolved(links) { return links.length > 0 && links.every(isLinkDone); }

function linkDrillRow(issue, links, cols) {
  const rows = links.map(l => {
    const other = otherIssueOf(l);
    if (!other) return '';
    const rel = l.outwardIssue ? (l.type?.outward || 'relates to') : (l.type?.inward || 'relates to');
    const s = other.fields?.status?.name || '—', p = other.fields?.priority?.name || '—', pc = priColor(p);
    const done = isLinkDone(l);
    return `<tr>
      <td class="t-sm" style="color:var(--fg-4)">${esc(rel)}</td>
      <td><a class="t-key" href="${JIRA_BASE}/${esc(other.key)}" target="_blank" rel="noopener">${esc(other.key)}</a></td>
      <td class="t-sum">${esc(other.fields?.summary || '—')}</td>
      <td>${done ? badge(s, 'var(--green-30)', 'var(--aa-green)', 'circle-check', true) : badge(s, sBg(s), sFg(s), null, true)}</td>
      <td>${badge(p, pc.bg, pc.fg)}</td>
    </tr>`;
  }).join('');
  return `<tr class="link-drill-row"><td colspan="${cols || PRIORITY_COLS}">
    <div class="sub-drill">
      <div class="sub-drill-head"><div class="sub-drill-title">${ico('link',12)}Linked tickets — ${esc(issue.key)}</div></div>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th>Relationship</th><th>Key</th><th>Summary</th><th>Status</th><th>Priority</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty-inline">No linked tickets</td></tr>'}</tbody>
      </table></div>
    </div>
  </td></tr>`;
}

function priorityRow(issue, rank) {
  const s = issue.fields?.status?.name || '—', p = issue.fields?.priority?.name || '—', pc = priColor(p);
  const links = Array.isArray(issue.fields?.issuelinks) ? issue.fields.issuelinks : [];
  const showLinks = s === 'Awaiting Internal Team';
  const isOpen = showLinks && expandedLinkDrills.has(issue.key);
  const readyToClose = showLinks && allLinksResolved(links);
  const readyChip = readyToClose
    ? `<span class="ready-chip" title="All ${links.length} linked ticket${links.length !== 1 ? 's are' : ' is'} closed or resolved — check whether this one can be resolved too">${ico('circle-check', 11)}Ready to close</span>`
    : '';
  const linkBtn = showLinks
    ? `<button class="link-btn${isOpen ? ' is-active' : ''}" title="${links.length} linked ticket${links.length !== 1 ? 's' : ''}" onclick="toggleLinkDrill('${esc(issue.key)}')">${ico('link', 10)}<span class="link-count">${links.length}</span></button>`
    : '';
  const mainRow = `<tr data-ticket="${esc(issue.key)}">
    <td class="t-sm" style="text-align:right;color:var(--fg-4)">${rank}</td>
    <td><a class="t-key" href="${JIRA_BASE}/${issue.key}" target="_blank" rel="noopener">${esc(issue.key)}</a></td>
    <td class="t-sum">${esc(issue.fields?.summary || '—')}</td>
    <td>${badge(s, sBg(s), sFg(s), null, true)}${linkBtn}${readyChip}</td>
    <td>${badge(p, pc.bg, pc.fg)}</td>
    <td class="t-sm">${esc(issue.fields?.assignee?.displayName || 'Unassigned')}</td>
    <td>${slaCell(issue)}</td>
    <td class="t-sm">${fmtShortDateTime(issue.fields?.updated)}</td>
  </tr>`;
  return mainRow + (isOpen ? linkDrillRow(issue, links, PRIORITY_COLS) : '');
}

// Selected assignee for the Priority List ('' = everyone). Held at module
// scope so the 5-minute auto-refresh doesn't silently reset the filter.
let priorityAssignee = '';

// Awaiting Internal Team tickets are blocked on someone else's work rather
// than the TAC team's next action, so by design they clutter the triage list
// more than they inform it — hidden by default, one tickbox to bring them
// back. Deliberately NOT persisted (no localStorage): every fresh load starts
// hidden, matching "by default this is unticked" rather than remembering the
// last session's choice.
let showAwaitingInternal = false;
function onShowAwaitingInternalChange(checked) {
  showAwaitingInternal = checked;
  renderPriorityTable(ALL_ISSUES);
}

// TAC Tier multi-select. Starts with every known option selected, i.e. no
// filtering — a Set of what's INCLUDED, not what's excluded, so a value this
// build doesn't recognise (a tier added in Jira after this shipped) still
// shows by default instead of silently vanishing. Unlike the assignee filter
// and the Awaiting Internal Team tickbox, changing it redraws the whole
// controls block (renderPriorityList, not just renderPriorityTable) because
// the toggle button's own label has to reflect the new selection.
let selectedTacTiers = new Set(TAC_TIER_OPTIONS);
let tacTierPanelOpen = false;

function tacTierOf(issue) { return issue.fields?.[TAC_TIER_FIELD]?.value ?? null; }
// Every option checked is treated as "no filter" rather than literal set
// membership, so a ticket with no TAC Tier value (none exist today, but
// nothing guarantees that) isn't silently dropped by the default state.
// Once the user deselects anything, filtering becomes exact membership.
function matchesTacTier(issue) {
  return selectedTacTiers.size === TAC_TIER_OPTIONS.length || selectedTacTiers.has(tacTierOf(issue));
}
function tacTierButtonLabel() {
  if (selectedTacTiers.size === TAC_TIER_OPTIONS.length) return 'TAC Tier: All';
  if (selectedTacTiers.size === 0) return 'TAC Tier: None';
  return 'TAC Tier: ' + TAC_TIER_OPTIONS.filter(t => selectedTacTiers.has(t)).join(', ');
}
function toggleTacTierPanel(e) {
  e.stopPropagation();
  tacTierPanelOpen = !tacTierPanelOpen;
  renderPriorityList(ALL_ISSUES);
}
function onTacTierCheck(value, checked) {
  if (checked) selectedTacTiers.add(value); else selectedTacTiers.delete(value);
  renderPriorityList(ALL_ISSUES);
}
// Closes the panel on any click outside it. Registered once at boot (see
// bottom of file) rather than per-render, so it never piles up duplicates.
//
// Surgical on purpose: calling renderPriorityList() here would replace the
// whole controls block, and when the click that closed the panel landed on
// another control in that row it destroyed that control mid-click and the
// click was swallowed. See closeClosedPanelsOnOutsideClick for the full note.
function closeTacTierPanelOnOutsideClick() {
  if (!tacTierPanelOpen) return;
  tacTierPanelOpen = false;
  collapseMultiSelectPanels(document.getElementById('priority-root'));
}
// Drop the open panel and un-press its button inside `root`, touching nothing
// else. The `is-open` class also drives the button's chevron rotation.
function collapseMultiSelectPanels(root) {
  if (!root) return;
  root.querySelectorAll('.tt-ms-panel').forEach(p => p.remove());
  root.querySelectorAll('.tt-ms-btn.is-open').forEach(b => b.classList.remove('is-open'));
}

function assigneeName(issue) {
  return issue.fields?.assignee?.displayName || 'Unassigned';
}

function renderPriorityList(issues) {
  const el = document.getElementById('priority-root');
  if (!el) return; // view not mounted yet
  if (!issues || !issues.length) {
    const who = personalUser?.name || 'you';
    el.innerHTML = personalBanner() + (personalMode && personalUser
      ? `<div class="empty">No open tickets assigned to ${esc(who)}.</div>`
      : `<div class="empty">No open tickets.</div>`);
    return;
  }
  // Options come from the whole open queue so the counts show the real
  // per-person load, not the load within the current filter.
  const counts = tally(issues, assigneeName);
