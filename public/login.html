<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Access4 UK TAC</title>
<style>
:root{
  --sb-primary:#008EAA; --sb-secondary:#244C5A; --sb-lightblue:#2DCCD3;
  --aa-primary:#00738A;
  --white:#fff; --grey-50:#F9FAFB; --grey-200:#E5E7EB; --grey-500:#6B7280; --grey-700:#374151; --grey-900:#111827;
  --font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-sans);background:var(--grey-50);color:var(--grey-700);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--white);border:1px solid var(--grey-200);border-radius:10px;
  box-shadow:0 4px 16px rgba(17,24,39,.06);
  padding:40px 36px;max-width:420px;width:100%;text-align:center;
}
.mark{width:44px;height:44px;color:var(--sb-lightblue);margin:0 auto 18px}
h1{font-size:21px;line-height:1.3;font-weight:600;color:var(--sb-secondary);margin-bottom:8px}
p{font-size:14px;line-height:1.6;color:var(--grey-500);margin-bottom:26px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--sb-primary);color:#fff;text-decoration:none;
  font-size:15px;font-weight:600;padding:12px 20px;border-radius:6px;
  transition:background-color .15s;
}
.btn:hover{background:var(--aa-primary)}
.btn:focus-visible{outline:2px solid var(--sb-secondary);outline-offset:2px}
.foot{margin-top:22px;font-size:12.5px;line-height:1.6;color:#9CA3AF}
</style>
</head>
